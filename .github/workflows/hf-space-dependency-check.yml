name: Hugging Face Space dependency resolution

on:
  pull_request:
    branches: [main]
    paths:
      - "hf_space/README.md"
      - "hf_space/requirements.txt"
      - ".github/workflows/hf-space-dependency-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Resolve the exact Space SDK and requirements together
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          readme = Path("hf_space/README.md").read_text(encoding="utf-8")

          def metadata_value(name: str) -> str:
              prefix = f"{name}:"
              for line in readme.splitlines():
                  if line.startswith(prefix):
                      return line.split(":", 1)[1].strip().strip('"').strip("'")
              raise SystemExit(f"Space README is missing {name}")

          sdk = metadata_value("sdk_version")
          python_version = metadata_value("python_version")
          if python_version != "3.11":
              raise SystemExit("Update this resolver workflow when the Space Python version changes")

          command = [
              sys.executable, "-m", "pip", "install", "--dry-run", "--no-cache-dir",
              "-r", "hf_space/requirements.txt", f"streamlit=={sdk}",
          ]
          print("Resolving:", " ".join(command))
          subprocess.run(command, check=True)
          PY
