name: Hugging Face Space dependency resolution

on:
  pull_request:
    branches: [main]
    paths:
      - "hf_space/README.md"
      - "hf_space/requirements.txt"
      - ".github/workflows/hf-space-dependency-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Resolve the exact Space SDK and requirements together
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          readme = Path("hf_space/README.md").read_text(encoding="utf-8")
          sdk = re.search(r'(?m)^sdk_version:\\s*["\\']?([^"\\'\\s]+)', readme)
          python_version = re.search(r'(?m)^python_version:\\s*["\\']?([^"\\'\\s]+)', readme)
          if not sdk or not python_version:
              raise SystemExit("Space README must declare sdk_version and python_version")
          if python_version.group(1) != "3.11":
              raise SystemExit("Update this resolver workflow when the Space Python version changes")
          command = [
              sys.executable, "-m", "pip", "install", "--dry-run", "--no-cache-dir",
              "-r", "hf_space/requirements.txt", f"streamlit=={sdk.group(1)}",
          ]
          print("Resolving:", " ".join(command))
          subprocess.run(command, check=True)
          PY
