name: Paid issue publish

# Commits what paid-issue-hunter.yml produced. Separate file on purpose: the
# scheduled workflow is forbidden from writing (test_external_action_gates), and a
# workflow_run trigger is the only way to keep the 6-hour cadence and still land
# PAID-ISSUES.md in the repository.
#
# It only publishes on a successful run of the hunter on main. Nothing else is
# written, nothing is merged, no issue is touched.

on:
  workflow_run:
    workflows: ["Paid issue hunter"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: paid-issue-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download the evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: paid-issues
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifact

      - name: Place the files
        run: |
          set -e
          test -f artifact/PAID-ISSUES.md
          test -f artifact/data/money/paid_issues.json
          cp artifact/PAID-ISSUES.md PAID-ISSUES.md
          mkdir -p data/money
          cp artifact/data/money/paid_issues.json data/money/paid_issues.json
          python3 - <<'PY'
          import json
          data = json.load(open("data/money/paid_issues.json"))
          assert data["mutations_performed"] == 0, "refusing to publish a hunter record with mutations"
          print("rows:", len(data["rows"]), "statuses:", data["status_values"])
          PY

      - name: Commit when it changed
        run: |
          git config user.name "barrot-hunter"
          git config user.email "barrot-hunter@users.noreply.github.com"
          git add PAID-ISSUES.md data/money/paid_issues.json
          if git diff --cached --quiet; then
            echo "no change this run"
            exit 0
          fi
          git commit -m "hunter: paid issue scan $(date -u +%Y-%m-%dT%H:%MZ) from run ${{ github.event.workflow_run.id }}"
          git push origin main
