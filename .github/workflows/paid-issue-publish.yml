name: Paid issue publish (disabled; hunter artifact remains read-only)

on:
  workflow_run:
    workflows: ["Paid issue hunter"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "The paid-issue hunter remains read-only and retains its result as a seven-day workflow artifact."
          echo "This publisher previously copied that artifact into repository files and pushed directly to main."
          echo "Repository publication is disabled pending explicit authorization and independently verified branch protection."
          echo "No credentials are loaded, no files are changed, and no repository or external mutation occurs."
