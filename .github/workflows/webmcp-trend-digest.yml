name: WebMCP Trend Digest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Ingest WebMCP discourse
        run: python3 scripts/webmcp_trend_ingest.py
      - name: Distill new entries
        run: python3 scripts/webmcp_trend_distill.py
      - name: Summarize into ranked digest
        run: python3 scripts/webmcp_trend_summary.py
      - name: Upload webmcp-trend-digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-trend-digest-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/webmcp_trend_log.jsonl
            ping-pongings/knowledge-base/webmcp_trend_summary.json
            web/webmcp_trend_summary.json
          if-no-files-found: warn
          retention-days: 7
