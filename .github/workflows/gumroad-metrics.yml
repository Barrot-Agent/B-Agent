name: Gumroad Metrics

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch aggregate metrics
        run: python3 scripts/gumroad_metrics.py
      - name: Upload gumroad-aggregate-metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: gumroad-aggregate-metrics-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/gumroad_metrics.json
          if-no-files-found: warn
          retention-days: 7
