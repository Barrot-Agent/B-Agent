name: Gumroad Metrics (read-only artifact)

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gumroad-metrics-readonly
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch allowlisted aggregate product metrics
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
        run: python3 scripts/gumroad_metrics.py

      - name: Upload aggregate metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: gumroad-aggregate-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ping-pongings/knowledge-base/gumroad_metrics.json
          if-no-files-found: error
          retention-days: 30
