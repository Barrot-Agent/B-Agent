name: gumroad-metrics (disabled pending reviewed automation policy)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "The previous scheduled workflow used a Gumroad token, printed the raw product API response to job logs and wrote metrics to main. Re-enable only after output minimization, log privacy review and protected approval."
          echo "No credentials are read and no repository mutation is performed."
