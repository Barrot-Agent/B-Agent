name: Barrot Gated Merge (disabled; report-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report_only:
    name: Confirm gated merge is disabled
    runs-on: ubuntu-latest
    steps:
      - name: Report safety state
        shell: bash
        run: |
          set -euo pipefail
          echo "The gated-merge workflow is disabled pending independent verification."
          echo "This workflow performs no status writes, comments, labels, approvals, branch updates, or merges."
          echo "Any future merge implementation must verify current base/head SHAs, required checks, non-draft state, conflict-free mergeability, review approval, and explicit authorization."
