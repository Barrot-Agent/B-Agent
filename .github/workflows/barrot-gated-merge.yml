name: Barrot Gated Merge (fail-closed)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit-only:
    name: Merge disabled pending gate verification
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic merge is intentionally disabled."
          echo "This workflow does not approve, label, or merge pull requests."
          echo "A future merge gate must require successful mandatory checks, current base, non-draft state, mergeability, and explicit authorized approval."
          echo "No repository content was changed by this workflow."
