name: Barrot Gated Merge

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gated-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      MAX_FILES: 25
      MAX_LINES: 1500
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate and merge
        run: |
          set +e
          PROTECTED='^(hf_space/|core/|web/|scripts/emit_signal.py|\.github/workflows/)'
          BANNED='130\.8M|144-agent|Willowchip|Aethel|Planck-scale|Loihi|quantum harmonization|free energy'

          PRS=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --jq '.[].number')
          [ -z "$PRS" ] && { echo "No open PRs."; exit 0; }

          for PR in $PRS; do
            echo ""
            echo "===== PR #$PR ====="
            INFO=$(gh pr view "$PR" --repo "$REPO" --json title,labels,files,additions,deletions,statusCheckRollup)
            TITLE=$(echo "$INFO" | jq -r '.title')
            APPROVED=$(echo "$INFO" | jq -r '[.labels[].name] | index("approved") // empty')
            FILES=$(echo "$INFO" | jq -r '.files[].path')
            NFILES=$(echo "$FILES" | wc -l)
            NLINES=$(echo "$INFO" | jq -r '.additions + .deletions')
            echo "  $TITLE"
            echo "  files=$NFILES lines=$NLINES approved=${APPROVED:+yes}"

            REASONS=""

            FAILED=$(echo "$INFO" | jq -r '[.statusCheckRollup[]? | select(.conclusion=="FAILURE" or .conclusion=="CANCELLED" or .conclusion=="TIMED_OUT")] | length')
            PENDING=$(echo "$INFO" | jq -r '[.statusCheckRollup[]? | select(.status=="IN_PROGRESS" or .status=="QUEUED")] | length')
            [ "$FAILED" -gt 0 ] && REASONS="$REASONS\n- CI checks failing ($FAILED)"
            [ "$PENDING" -gt 0 ] && REASONS="$REASONS\n- CI still running ($PENDING)"

            DIFF=$(gh pr diff "$PR" --repo "$REPO" 2>/dev/null | grep '^+' || true)
            HITS=$(echo "$DIFF" | grep -EiO "$BANNED" | sort -u | tr '\n' ' ')
            [ -n "$HITS" ] && REASONS="$REASONS\n- Fiction vocabulary in diff: $HITS"

            TOUCHED=$(echo "$FILES" | grep -E "$PROTECTED" | tr '\n' ' ')
            if [ -n "$TOUCHED" ] && [ -z "$APPROVED" ]; then
              REASONS="$REASONS\n- Touches protected paths (needs 'approved' label): $TOUCHED"
            fi

            if [ -z "$APPROVED" ]; then
              [ "$NFILES" -gt "$MAX_FILES" ] && REASONS="$REASONS\n- Too many files ($NFILES > $MAX_FILES); needs 'approved' label"
              [ "$NLINES" -gt "$MAX_LINES" ] && REASONS="$REASONS\n- Too many lines ($NLINES > $MAX_LINES); needs 'approved' label"
            fi

            if [ -n "$REASONS" ]; then
              echo "  BLOCKED:$(printf "$REASONS")"
              MARKER="<!-- barrot-gated-merge -->"
              HAS=$(gh pr view "$PR" --repo "$REPO" --json comments --jq "[.comments[] | select(.body | contains(\"$MARKER\"))] | length")
              if [ "$HAS" = "0" ]; then
                gh pr comment "$PR" --repo "$REPO" --body "$(printf "%s\n**Barrot Gated Merge — held back**\n%s\n\n_Apply the \`approved\` label to override path/size gates. CI and content gates cannot be overridden._" "$MARKER" "$(printf "$REASONS")")" >/dev/null 2>&1
              fi
              continue
            fi

            echo "  All gates passed. Merging."
            gh pr merge "$PR" --repo "$REPO" --squash 2>&1 || echo "  merge failed (will retry next cycle)"
          done
