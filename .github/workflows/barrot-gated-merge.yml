name: Barrot Gated Merge (disabled pending verified gates)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  disabled:
    name: Merge disabled pending independent verification
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic merging is disabled."
          echo "This workflow does not approve, label, set commit statuses, or merge pull requests."
          echo "A replacement gate must verify mandatory checks, current base, non-draft state, mergeability, and explicit authorized approval."
          echo "No repository content was changed by this workflow."
