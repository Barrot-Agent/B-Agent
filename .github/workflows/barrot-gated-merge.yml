name: Barrot Gated Merge

on:
  push:
    branches: ["integration/**"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  readiness:
    name: Merge readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Verify exact-head tests and merge readiness
        shell: bash
        run: |
          set -euo pipefail
          blockers=()
          add_blocker() { blockers+=("$1"); }

          pr_number="$EVENT_PR_NUMBER"
          if [[ -z "$pr_number" ]]; then
            owner="${REPOSITORY%%/*}"
            pr_list="$(gh api "repos/${REPOSITORY}/pulls?state=open&head=${owner}:${REF_NAME}&per_page=100")"
            if [[ "$(jq 'length' <<< "$pr_list")" == "1" ]]; then
              pr_number="$(jq -r '.[0].number' <<< "$pr_list")"
            else
              add_blocker "could not resolve exactly one open PR for this branch"
            fi
          fi

          if [[ -n "$pr_number" ]]; then
            if ! pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}" 2>/dev/null)"; then
              add_blocker "PR metadata could not be read"
              pr_json='{}'
            fi
            actual_head="$(jq -r '.head.sha // empty' <<< "$pr_json")"
            draft="$(jq -r 'if has("draft") then (.draft|tostring) else "unknown" end' <<< "$pr_json")"
            state="$(jq -r '.state // empty' <<< "$pr_json")"
            base_ref="$(jq -r '.base.ref // empty' <<< "$pr_json")"
            base_sha="$(jq -r '.base.sha // empty' <<< "$pr_json")"
            mergeable="$(jq -r '.mergeable // false' <<< "$pr_json")"

            [[ "$actual_head" == "$EXPECTED_HEAD_SHA" ]] || add_blocker "PR head does not match the exact event commit"
            [[ "$draft" == "false" ]] || add_blocker "PR must be marked ready for review"
            [[ "$state" == "open" ]] || add_blocker "PR is not open"
            [[ "$base_ref" == "main" ]] || add_blocker "PR must target main"
            [[ "$mergeable" == "true" ]] || add_blocker "PR is not confirmed mergeable"

            if current_main="$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)"; then
              [[ "$base_sha" == "$current_main" ]] || add_blocker "PR base is behind current main; update the branch and rerun checks"
            else
              add_blocker "current main commit could not be verified"
            fi

            required_checks=("Tests" "Full repository test suite" "pip-audit" "audit" "Verify PR merge tree against current base")
            if check_runs="$(gh api "repos/${REPOSITORY}/commits/${actual_head}/check-runs?per_page=100" 2>/dev/null)"; then
              deadline=$((SECONDS + 600))
              while true; do
                pending=0
                failed=0
                for required in "${required_checks[@]}"; do
                  matching="$(jq --arg name "$required" --arg sha "$actual_head" '[.check_runs[] | select(.name == $name and .head_sha == $sha)] | sort_by(.started_at // .completed_at // "")' <<< "$check_runs")"
                  count="$(jq 'length' <<< "$matching")"
                  if [[ "$count" == "0" ]]; then
                    pending=1
                    continue
                  fi
                  latest="$(jq 'last' <<< "$matching")"
                  run_status="$(jq -r '.status // empty' <<< "$latest")"
                  run_conclusion="$(jq -r '.conclusion // empty' <<< "$latest")"
                  if [[ "$run_status" != "completed" ]]; then
                    pending=1
                  elif [[ "$run_conclusion" != "success" ]]; then
                    add_blocker "required exact-head check '$required' concluded '${run_conclusion:-missing}'"
                    failed=1
                  fi
                done
                [[ "$failed" == "0" ]] || break
                [[ "$pending" == "0" ]] && break
                if (( SECONDS >= deadline )); then
                  add_blocker "timed out waiting for required exact-head checks"
                  break
                fi
                sleep 15
                if ! check_runs="$(gh api "repos/${REPOSITORY}/commits/${actual_head}/check-runs?per_page=100" 2>/dev/null)"; then
                  add_blocker "exact-head check inventory became unavailable"
                  break
                fi
              done
            else
              add_blocker "exact-head checks could not be read"
            fi
          else
            add_blocker "PR number could not be resolved"
          fi

          if [[ "${#blockers[@]}" -gt 0 ]]; then
            echo "::error::READINESS=BLOCKED"
            printf '%s\n' "${blockers[@]}"
            exit 1
          fi

          echo "READINESS=READY_FOR_EXPLICIT_MERGE"
          echo "Exact-head tests and repository checks passed. No approval, force-push, or branch-protection setting is imposed by this workflow."
          echo "This workflow is read-only; GitHub itself enforces any active repository merge rules when a merge is requested."
