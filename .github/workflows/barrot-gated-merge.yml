name: Barrot Gated Merge (disabled pending verified gates)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  disabled:
    name: Disabled safety notice (not an approval)
    runs-on: ubuntu-latest
    steps:
      - name: Explain report-only state
        run: |
          echo "Automated merge evaluation and merging are disabled pending independently verified gates."
          echo "This run is a notice only; it does not create a status, approve, comment, label, or merge a pull request."
          echo "A successful run must not be interpreted as merge approval."
