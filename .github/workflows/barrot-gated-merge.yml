name: Barrot Gated Merge (read-only audit; no merge)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  read-only-status:
    runs-on: ubuntu-latest
    steps:
      - name: State the enforcement boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "This workflow is a report-only placeholder."
          echo "It does not create statuses, comments, labels, approvals, or merges."
          echo "Repository branch protection must enforce required checks independently."
