name: Barrot Gated Merge (Disabled Pending Governance Repair)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  disabled:
    name: Automated merging disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled automation
        run: |
          echo "Automated merging is disabled pending independently verified governance controls."
          echo "This workflow is read-only and cannot merge, label, approve, comment, or write statuses."
