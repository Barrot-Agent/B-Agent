name: Ping-Pong Chain

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the refinement chain
        required: false

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINGPONG_TASK: ${{ inputs.task || 'Analyze the current state of XRP cross-border payment adoption and summarize the most significant recent development, grounded only in verifiable facts.' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 scripts/pingpong.py
      - name: Upload pingpong artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingpong-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/log.jsonl
          if-no-files-found: warn
          retention-days: 7
