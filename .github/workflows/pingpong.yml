name: Ping-Pong Chain

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the refinement chain
        required: true

permissions:
  contents: write

jobs:
  chain:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINGPONG_TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/pingpong.py
      - name: Commit cycle to knowledge base
        run: |
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add ping-pongings/knowledge-base/log.jsonl
          git diff --cached --quiet || git commit -m "Ping-pong cycle logged [skip ci]"
          git push || (git pull --no-rebase --no-edit origin main && git push)
