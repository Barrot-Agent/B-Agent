name: Codespaces Dev Container Smoke

on:
  push:
    branches:
      - integration/free-gemini-codespaces-2026-11-20
  pull_request:
    branches:
      - main
    paths:
      - ".devcontainer/**"
      - "GEMINI.md"
      - ".github/workflows/codespaces-devcontainer-smoke.yml"

permissions:
  contents: read

jobs:
  devcontainer-smoke:
    name: Build Codespaces container and verify Gemini CLI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build dev container and run smoke checks
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          runCmd: |
            node --version
            npm --version
            gemini --version
