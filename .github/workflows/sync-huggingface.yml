name: Sync to Hugging Face (manual, gated)

on:
  workflow_dispatch:
    inputs:
      confirm_external_deploy:
        description: "Confirm an additive upload to the configured Hugging Face Space. This workflow no longer deletes remote files or propagates secrets."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync-hf:
    if: inputs.confirm_external_deploy == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - name: Additive upload to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || { echo "HF_TOKEN is required" >&2; exit 1; }
          python3 - <<'SCRIPT'
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="hf_space",
              repo_id="Scribedpengenius/Barrot-Omega",
              repo_type="space",
              commit_message="Manually approved additive upload from B-Agent",
          )
          print("Upload completed; remote files not present locally were not intentionally deleted.")
          SCRIPT
