name: Sync to Hugging Face (quarantined pending private-target and secret-rotation controls)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous workflow uploaded Space code and propagated or replaced multiple Space secrets in one approval step."
          echo "It did not verify that the destination Space was private or require a separate explicit secret-rotation approval."
          echo "It remains disabled until private-target verification, exact-main-SHA validation, deployment approval and separate secret-rotation authorization are enforced."
          echo "No Hugging Face token is read, no code is uploaded, and no Space secret is changed."
