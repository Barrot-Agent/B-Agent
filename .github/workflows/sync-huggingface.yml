name: Sync to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf_space/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

jobs:
  sync-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - name: Deploy hf_space/ as the entire Space (clean mirror)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'SCRIPT'
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="hf_space",
              repo_id="Scribedpengenius/Barrot-Omega",
              repo_type="space",
              delete_patterns=["*"],
              commit_message="Deploy v7 from B-Agent hf_space/ (clean mirror)",
          )
          print("DEPLOYED")
          SCRIPT
      - name: Propagate secrets to Space (GitHub secrets = source of truth)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 - << 'SCRIPT'
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "Scribedpengenius/Barrot-Omega"
          for key in ("GROQ_API_KEY", "DATABRICKS_TOKEN"):
              val = os.environ.get(key, "")
              if val:
                  api.add_space_secret(repo, key, val)
                  print("secret set:", key)
              else:
                  print("skipped (not in GitHub secrets):", key)
          api.add_space_variable(repo, "DATABRICKS_HOST", "dbc-82d64fee-1c2e.cloud.databricks.com")
          api.add_space_variable(repo, "DATABRICKS_WAREHOUSE_ID", "c85b8f4fea8cd527")
          print("variables set")
          SCRIPT
