name: Sync to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "hf_space/**"
      - ".github/workflows/sync-huggingface.yml"
  workflow_dispatch:

jobs:
  sync-hf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - name: Deploy hf_space/ as the entire Space (clean mirror)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'SCRIPT'
          from huggingface_hub import HfApi
          import os
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path="hf_space",
              repo_id="Scribedpengenius/Barrot-Omega",
              repo_type="space",
              delete_patterns=["*"],
              commit_message="Deploy v7 from B-Agent hf_space/ (clean mirror)",
          )
          print("DEPLOYED")
          SCRIPT
