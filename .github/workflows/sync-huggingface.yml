name: Sync to Hugging Face

on:
  workflow_dispatch:
    inputs:
      confirm_external_change:
        description: "Set to YES only after explicit human approval for this specific run"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

      expected_source_sha:
        description: "Expected exact main commit approved for this external action"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-hf:
    if: ${{ inputs.confirm_external_change == 'YES' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact approved main commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected source SHA must be a full commit hash." >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Checked-out main commit does not match the approved source SHA." >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - name: Upload hf_space/ to the Space without deleting remote-only files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 - << 'SCRIPT'
          from huggingface_hub import HfApi
          import os
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("HF_TOKEN is required to sync the Hugging Face Space")
          api = HfApi(token=token)
          api.upload_folder(
              folder_path="hf_space",
              repo_id="Scribedpengenius/Barrot-Omega",
              repo_type="space",
              commit_message="Deploy hf_space/ from B-Agent",
          )
          print("DEPLOYED")
          SCRIPT
      - name: Propagate secrets to Space (GitHub secrets = source of truth)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 - << 'SCRIPT'
          from huggingface_hub import HfApi
          import os
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              raise SystemExit("HF_TOKEN is required to propagate Space secrets")
          api = HfApi(token=token)
          repo = "Scribedpengenius/Barrot-Omega"
          # resolve name collisions: variables and secrets must not share names
          for name in ("DATABRICKS_HOST", "DATABRICKS_WAREHOUSE_ID", "GROQ_API_KEY", "DATABRICKS_TOKEN"):
              try:
                  api.delete_space_variable(repo, name)
                  print("removed colliding variable:", name)
              except Exception:
                  pass
          vals = {
              "GROQ_API_KEY": os.environ.get("GROQ_API_KEY", ""),
              "DATABRICKS_TOKEN": os.environ.get("DATABRICKS_TOKEN", ""),
              "DATABRICKS_HOST": "dbc-82d64fee-1c2e.cloud.databricks.com",
              "DATABRICKS_WAREHOUSE_ID": "c85b8f4fea8cd527",
          }
          for key, val in vals.items():
              if val:
                  api.add_space_secret(repo, key, val)
                  print("secret set:", key)
              else:
                  print("skipped (missing):", key)
          SCRIPT
