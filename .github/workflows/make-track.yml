name: Make Track

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme/mood for the instrumental (e.g. "late night highway drive, melancholy but hopeful")'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  make_track:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MUSICGPT_API_KEY: ${{ secrets.MUSICGPT_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
      TRACK_THEME: ${{ github.event.inputs.theme }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate track
        run: python3 scripts/make_track.py
      - name: Upload make-track artifact
        uses: actions/upload-artifact@v4
        with:
          name: make-track-${{ github.run_number }}
          path: |
            music/
          if-no-files-found: warn
          retention-days: 7
