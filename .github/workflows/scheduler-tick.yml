name: Scheduler Queue Audit (read-only; dispatch paused)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: barrot-scheduler-queue-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only scheduler queue audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: List pending entries without dispatch or mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/scheduler.py list | tee artifacts/schedule-queue-audit.txt

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-queue-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/schedule-queue-audit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write run summary
        shell: bash
        run: |
          {
            echo "## Scheduler queue audit"
            echo
            echo "Pending entries were listed without dispatching workflows or mutating repository state."
            echo "Automatic queue execution is paused until a durable external-state and workflow-allowlist design is verified."
          } >> "$GITHUB_STEP_SUMMARY"
