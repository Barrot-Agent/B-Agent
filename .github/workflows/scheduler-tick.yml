name: Scheduler Queue Audit

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: barrot-scheduler-queue-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only scheduler queue audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List pending entries without dispatch or mutation
        run: |
          mkdir -p artifacts
          python3 scripts/scheduler.py list | tee artifacts/schedule-queue-audit.txt

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-queue-audit-${{ github.run_id }}
          path: artifacts/schedule-queue-audit.txt
          if-no-files-found: error
          retention-days: 30
