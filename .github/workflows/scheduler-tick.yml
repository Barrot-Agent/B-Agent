name: Scheduler Tick (disabled pending safe durable state store)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "The previous scheduled tick had contents:write and actions:write, dispatched any workflow present in the repository, and committed queue updates directly to main."
          echo "It is disabled until queue dispatch is restricted to an explicit read-only allowlist and queue state is stored without unattended main-branch writes."
          echo "No credentials are read and no repository mutation is performed."
