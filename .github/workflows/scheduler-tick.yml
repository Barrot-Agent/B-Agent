name: Scheduler Tick (disabled pending durable non-main state store)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: echo "Unattended scheduling is disabled because the previous tick committed queue state to main and held contents/actions write permissions. Re-enable only after a separately reviewed durable non-main state store and per-action approval design exist."
