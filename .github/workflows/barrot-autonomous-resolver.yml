name: Barrot Autonomous Resolver (disabled pending approval-gated issue routing)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "The prior hourly resolver scanned failed runs across branches and created or assigned GitHub work without human approval."
          echo "It is disabled until failures are filtered to the protected main branch, transient PR failures are excluded, and every external write is approval-gated."
          echo "The automatic merge workflow is separately disabled; this workflow does not resolve or merge code."
