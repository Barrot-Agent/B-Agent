name: Barrot Autonomous Resolver (Read-Only Audit)

# Scheduled monitoring only. Issue creation, issue/PR assignment, comments,
# and automatic routing are intentionally disabled pending an approved apply path.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  audit:
    name: Collect failure and queue evidence without mutation
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Collect read-only repository state
        run: |
          mkdir -p artifacts
          gh run list --repo "$REPO" --status failure --limit 100 \
            --json workflowName,conclusion,createdAt,url > artifacts/failing_workflows.json
          gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title,assignees,url > artifacts/open_issues.json
          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,title,assignees,url > artifacts/open_pull_requests.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts")
          failures = json.loads((root / "failing_workflows.json").read_text())
          issues = json.loads((root / "open_issues.json").read_text())
          prs = json.loads((root / "open_pull_requests.json").read_text())
          summary = {
              "status": "READ_ONLY_AUDIT",
              "failing_workflow_runs_returned": len(failures),
              "open_issues_returned": len(issues),
              "unassigned_issues_returned": sum(not item.get("assignees") for item in issues),
              "open_pull_requests_returned": len(prs),
              "unassigned_pull_requests_returned": sum(not item.get("assignees") for item in prs),
              "issue_creation_performed": False,
              "issue_assignment_performed": False,
              "pull_request_assignment_performed": False,
              "comments_or_closures_performed": False
          }
          (root / "audit_summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: barrot-autonomous-resolver-read-only-audit
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
