name: Barrot Autonomous Resolver

# Continuously monitors failing workflows and open GitHub issues,
# then routes each one toward autonomous fixing.
# Resulting PRs are picked up and merged by the Barrot Auto-Merge PRs workflow.

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  resolve:
    name: Route failures for autonomous fixing
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      AUTO_ASSIGNEE: ${{ vars.COPILOT_ASSIGNEE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # 1. Failing workflows → open a tracked issue
      # -----------------------------------------------------------------------
      - name: Open issues for failing workflows
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Scanning for workflows whose latest run failed in the last 24 h ==="

          # The helper paginates the API, applies the UTC cutoff, and exits nonzero
          # on API/JSON/pagination errors. An incomplete scan must not look like no failures.
          FAILED_WORKFLOWS_JSON=$(python scripts/list_recent_failed_workflows.py --repo "$REPO" --hours 24)

          if [ "$FAILED_WORKFLOWS_JSON" = "[]" ]; then
            echo "No workflows with a latest failed run in the last 24 hours."
          else
            while IFS=$'\t' read -r WF_NAME RUN_URL; do
              TITLE="[Auto] Workflow failing: $WF_NAME"

              # Query errors fail the step instead of being treated as no existing issue.
              EXISTING=$(gh issue list \
                --repo "$REPO" \
                --state open \
                --search "\"$TITLE\" in:title" \
                --json number \
                --jq 'length')

              if [ "$EXISTING" -gt "0" ]; then
                echo "  Issue already open for: $WF_NAME — skipping."
                continue
              fi

              BODY=$(printf '## Failing workflow: `%s`\n\nThe latest run of workflow `%s` failed within the last 24 hours. Please investigate the root cause, apply a fix, and open a pull request.\n\n**Most recent failed run:** %s\n\n---\n_This issue was opened automatically by the Barrot Autonomous Resolver._' \
                "$WF_NAME" "$WF_NAME" "$RUN_URL")

              ASSIGNEE_ARGS=()
              if [ -n "$AUTO_ASSIGNEE" ]; then
                ASSIGNEE_ARGS+=(--assignee "$AUTO_ASSIGNEE")
              fi

              gh issue create \
                --repo "$REPO" \
                --title "$TITLE" \
                --body "$BODY" \
                "${ASSIGNEE_ARGS[@]}"
              echo "  Issue created for: $WF_NAME"
            done < <(printf '%s' "$FAILED_WORKFLOWS_JSON" | jq -r '.[] | [.workflow_name, .url] | @tsv')
          fi

      # -----------------------------------------------------------------------
      # 2. Optionally assign unassigned issues when a valid assignee is configured
      # -----------------------------------------------------------------------
      - name: Assign unassigned issues
        run: |
          set +e
          if [ -z "$AUTO_ASSIGNEE" ]; then
            echo "No COPILOT_ASSIGNEE repository variable configured; skipping issue assignment."
            exit 0
          fi
          echo "=== Scanning for open issues with no assignees ==="

          UNASSIGNED=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --limit 100 \
            --json number,title,assignees \
            --jq '.[] | select(.assignees | length == 0) | .number' \
            2>/dev/null || true)

          if [ -z "$UNASSIGNED" ]; then
            echo "No unassigned open issues found."
          else
            while IFS= read -r ISSUE_NUM; do
              echo "  Assigning issue #$ISSUE_NUM to $AUTO_ASSIGNEE…"
              gh issue edit "$ISSUE_NUM" \
                --repo "$REPO" \
                --add-assignee "$AUTO_ASSIGNEE" \
                2>/dev/null && echo "  ✅ Issue #$ISSUE_NUM assigned." \
                            || echo "  ⚠️  Could not assign issue #$ISSUE_NUM."
            done <<< "$UNASSIGNED"
          fi

          echo "=== Barrot Autonomous Resolver cycle complete ==="

      # -----------------------------------------------------------------------
      # 3. Optionally assign unassigned pull requests when a valid assignee is configured
      # -----------------------------------------------------------------------
      - name: Assign unassigned pull requests
        run: |
          set +e
          if [ -z "$AUTO_ASSIGNEE" ]; then
            echo "No COPILOT_ASSIGNEE repository variable configured; skipping pull request assignment."
            exit 0
          fi
          echo "=== Scanning for open pull requests with no assignees ==="

          UNASSIGNED_PRS=$(gh pr list \
            --repo "$REPO" \
            --state open \
            --limit 100 \
            --json number,title,assignees \
            --jq '.[] | select(.assignees | length == 0) | .number' \
            2>/dev/null || true)

          if [ -z "$UNASSIGNED_PRS" ]; then
            echo "No unassigned open pull requests found."
          else
            while IFS= read -r PR_NUM; do
              echo "  Assigning PR #$PR_NUM to $AUTO_ASSIGNEE…"
              gh pr edit "$PR_NUM" \
                --repo "$REPO" \
                --add-assignee "$AUTO_ASSIGNEE" \
                2>/dev/null && echo "  ✅ PR #$PR_NUM assigned." \
                            || echo "  ⚠️  Could not assign PR #$PR_NUM."
            done <<< "$UNASSIGNED_PRS"
          fi

          echo "=== Barrot Autonomous Resolver cycle complete ==="
