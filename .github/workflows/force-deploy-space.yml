name: Force Deploy Space (disabled pending protected approval)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        shell: bash
        run: |
          set -euo pipefail
          echo "Disabled: prior workflow force-pushed to a Hugging Face Space. No force deployment is permitted in the unattended path."
          echo "No credentials are read and no external or repository mutation is performed."
