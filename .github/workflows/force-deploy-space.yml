name: Force Deploy Space (disabled)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Audit note only; use the separately reviewed deployment workflow if approved."
        required: false
        type: string

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed
        shell: bash
        run: |
          set -euo pipefail
          echo "This legacy workflow is disabled because it used a force-push to an external Hugging Face Space."
          echo "No token is read and no external deployment is attempted."
          echo "Use a reviewed, fast-forward-only deployment path with explicit authorization."
          exit 0
