name: Force Deploy Space (disabled; force-push prohibited)

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled force-push path
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Force Deploy Space"
            echo
            echo "**Status:** DEPLOYMENT_NOT_PERFORMED"
            echo
            echo "Disabled because the previous workflow used git push -f to overwrite the Hugging Face Space main branch."
            echo "No HF_TOKEN is accessed. No remote repository or Space is changed."
            echo "A replacement must use a reviewed, non-force update strategy and explicit approval."
          } >> "$GITHUB_STEP_SUMMARY"
