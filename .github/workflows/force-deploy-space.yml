name: Force Deploy Space (Disabled)

on:
  push:
    branches: ["safety/**"]
  workflow_dispatch:

permissions: {}

jobs:
  report-disabled-state:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report disabled state
        run: echo "DEPLOYMENT_NOT_PERFORMED: force-push to an external Space is prohibited; no external repository was changed."
