name: Force Deploy Space

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Push hf_space/ to the Space repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MAIN_SHA=$(git rev-parse --short HEAD)
          cd hf_space
          git init -q
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add -A
          git commit -q -m "Force sync from main ${MAIN_SHA}"
          git push -f "https://Scribedpengenius:${HF_TOKEN}@huggingface.co/spaces/Scribedpengenius/Barrot-Omega" HEAD:main
          echo "PUSHED to Space"
