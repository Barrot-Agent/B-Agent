name: Deploy to Databricks (manual, gated)

on:
  workflow_dispatch:
    inputs:
      confirm_external_deploy:
        description: "Confirm upload/update of the configured Databricks workspace and scheduled job."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-databricks:
    if: inputs.confirm_external_deploy == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install databricks-sdk
      - name: Deploy to Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python3 scripts/deploy_databricks.py
