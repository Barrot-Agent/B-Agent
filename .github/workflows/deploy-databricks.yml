name: Legacy Databricks Deploy (disabled; overwrite path quarantined)

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        shell: bash
        run: |
          set -euo pipefail
          echo "Disabled: the legacy script overwrites workspace files, resets an unpaused scheduled job, and triggers a run. Use the separately reviewed absent-target, no-overwrite workflow only after exact per-run approval."
          echo "No credentials are read and no external or repository mutation is performed."
