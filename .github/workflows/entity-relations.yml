name: Entity Relation Classification

on:
  workflow_dispatch:
    inputs:
      confirm_external_change:
        description: "Explicitly authorize this Groq-backed classification run"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

jobs:
  classify:
    if: ${{ inputs.confirm_external_change == 'YES' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Classify entity relations
        run: python3 scripts/entity_relation_classifier.py
      - name: Preserve classification as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrot-entity-relations-${{ github.run_number }}
          path: ping-pongings/knowledge-base/entity_relations.json
          if-no-files-found: warn
          retention-days: 30
