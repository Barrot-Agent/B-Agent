name: Entity Relation Classification

on:
  workflow_dispatch:
    inputs:
      confirm_external_change:
        description: "Explicitly authorize this Groq-backed classification run"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      expected_main_sha:
        description: "Exact current main commit approved for this external-model run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  classify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_external_change == 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Verify exact approved main revision
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch from main is required"; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full main SHA is required"; exit 1; }
          git fetch --no-tags --depth=1 origin main
          actual="$(git rev-parse HEAD)"
          current="$(git rev-parse FETCH_HEAD)"
          [[ "$actual" == "$EXPECTED_MAIN_SHA" && "$current" == "$EXPECTED_MAIN_SHA" ]] || { echo "::error::Main differs from the approved SHA"; exit 1; }

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Classify entity relations
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
        run: python3 scripts/entity_relation_classifier.py
      - name: Preserve classification as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: barrot-entity-relations-${{ github.run_number }}
          path: ping-pongings/knowledge-base/entity_relations.json
          if-no-files-found: warn
          retention-days: 30
