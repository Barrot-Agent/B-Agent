name: Entity Relation Classification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Classify entity relations
        run: python3 scripts/entity_relation_classifier.py
      - name: Upload entity-relations artifact
        uses: actions/upload-artifact@v4
        with:
          name: entity-relations-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/entity_relations.json
          if-no-files-found: warn
          retention-days: 7
