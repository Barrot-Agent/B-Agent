name: Knowledge Signal Cycle (disabled pending protected approval and PR-only publication)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    name: Fail-closed knowledge-cycle notice
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain disabled state
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Knowledge signal cycle not performed"
            echo
            echo "This workflow no longer reads provider secrets, runs external ingestion, or writes to main."
            echo "Knowledge ingestion and signal publication remain paused until a least-privilege provider adapter, point-in-time evidence gate, protected human approval, and PR-only publisher are independently verified."
            echo "No repository ref or external provider was modified."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "KNOWLEDGE_CYCLE_NOT_PERFORMED"
