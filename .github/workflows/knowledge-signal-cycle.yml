name: Knowledge Signal Cycle

on:
  schedule:
    - cron: '18 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests vaderSentiment
      - name: Ingest fresh news
        run: python3 scripts/knowledge_ingest.py
      - name: Distill new entries
        run: python3 scripts/knowledge_distill.py
      - name: Emit blended signal
        run: python3 scripts/emit_signal.py
      - name: Upload knowledge and signal snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-signal-cycle-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ping-pongings/knowledge-base/
            web/latest_signal.json
            web/signal_history.jsonl
