name: Knowledge Signal Cycle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-signal-cycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests vaderSentiment
      - name: Ingest fresh news
        run: python3 scripts/knowledge_ingest.py
      - name: Distill new entries
        run: python3 scripts/knowledge_distill.py
      - name: Emit fail-closed sentiment observation
        run: python3 scripts/emit_signal.py
      - name: Upload bounded knowledge and signal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-signal-cycle-${{ github.run_id }}
          path: |
            ping-pongings/knowledge-base/log.jsonl
            ping-pongings/knowledge-base/config.json
            web/latest_signal.json
            web/signal_history.jsonl
          if-no-files-found: warn
          retention-days: 30
