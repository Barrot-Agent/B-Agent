name: Knowledge Signal Cycle

on:
  workflow_dispatch:
    inputs:
      confirm_external_research:
        description: "Explicitly authorize public-news ingestion and Groq-backed signal distillation"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

jobs:
  cycle:
    if: ${{ inputs.confirm_external_research == 'YES' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests vaderSentiment
      - name: Ingest fresh news
        run: python3 scripts/knowledge_ingest.py
      - name: Distill new entries
        run: python3 scripts/knowledge_distill.py
      - name: Emit blended signal
        run: python3 scripts/emit_signal.py
      - name: Preserve knowledge and signal outputs as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrot-knowledge-signal-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/log.jsonl
            ping-pongings/knowledge-base/config.json
            web/latest_signal.json
            web/signal_history.jsonl
          if-no-files-found: warn
          retention-days: 90
