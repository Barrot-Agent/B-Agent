name: Knowledge Signal Cycle (quarantined pending evidence-first forecast integration)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The legacy cycle combines RSS ingestion, Groq sentiment distillation and a blended signal emitter."
          echo "Its sentiment score is not a fixed-horizon, leakage-safe XRP forecast and has no demonstrated out-of-sample lift or calibration."
          echo "It remains disabled until source receipts, point-in-time features and the verified forecast ledger replace the legacy signal path."
          echo "No provider credentials are read, no external service is called, and no repository or external mutation occurs."
