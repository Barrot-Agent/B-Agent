name: Deploy A2A Worker

on:
  push:
    branches: [main]
    paths:
      - 'a2a/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy Worker (creates the script first)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          command: deploy

      - name: Upload secrets (script now exists)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          secrets: |
            GROQ_API_KEY
            BRAIN_SHARED_SECRET
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAIN_SHARED_SECRET: ${{ secrets.BRAIN_SHARED_SECRET }}
