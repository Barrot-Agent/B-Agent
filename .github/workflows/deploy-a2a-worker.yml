name: Deploy A2A Worker

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type YES to approve this Cloudflare deployment
        required: true
        type: choice
        options: ["NO", "YES"]
      confirm_secret_rotation:
        description: "Set to YES only to authorize updating the Worker/Space secret during this deployment"
        required: true
        type: choice
        options: ["NO", "YES"]
      expected_main_sha:
        description: Exact 40-character current main commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'YES' && inputs.confirm_secret_rotation == 'YES'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify explicit approval and exact main revision
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch from main is required"; exit 1; }
          [[ "$CONFIRM" == "YES" ]] || { echo "::error::Explicit YES confirmation required"; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full main SHA is required"; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]] || { echo "::error::Checked-out SHA differs from approval"; exit 1; }
          [[ "$(git rev-parse origin/main)" == "$EXPECTED_MAIN_SHA" ]] || { echo "::error::main advanced after approval"; exit 1; }

      - name: Verify required Cloudflare and Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRAIN_SHARED_SECRET: ${{ secrets.BRAIN_SHARED_SECRET }}
          BARROT_AGENT_SECRET: ${{ secrets.BARROT_AGENT_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "::error::CLOUDFLARE_ACCOUNT_ID must be a 32-character account ID"; exit 1; }
          [[ -n "$BRAIN_SHARED_SECRET" ]] || { echo "::error::BRAIN_SHARED_SECRET is not configured"; exit 1; }
          [[ -n "$BARROT_AGENT_SECRET" ]] || { echo "::error::BARROT_AGENT_SECRET is not configured"; exit 1; }
          status="$(curl -sS -o "$RUNNER_TEMP/cloudflare-token-verify.json" -w "%{http_code}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [[ "$status" != "200" ]] || ! jq -e '.success == true and .result.status == "active"' "$RUNNER_TEMP/cloudflare-token-verify.json" >/dev/null; then
            echo "::error::Cloudflare API token verification failed (HTTP $status). Check token validity and account scope; the token value was not logged."
            jq -r '.errors[]? | "Cloudflare error " + (.code|tostring) + ": " + .message' "$RUNNER_TEMP/cloudflare-token-verify.json" || true
            exit 1
          fi
          echo "Cloudflare API token is active. Secret values were not displayed."

      - name: Deploy Worker (creates the script first)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3 official release commit
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          command: deploy

      - name: Upload Worker authentication secret (script now exists)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3 official release commit
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          secrets: |
            BRAIN_SHARED_SECRET
            BARROT_AGENT_SECRET
        env:
          BRAIN_SHARED_SECRET: ${{ secrets.BRAIN_SHARED_SECRET }}
          BARROT_AGENT_SECRET: ${{ secrets.BARROT_AGENT_SECRET }}
