name: Deploy A2A Worker

on:
  push:
    branches: [main]
    paths:
      - 'a2a/**'
      - '.github/workflows/deploy-a2a-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy Worker and durable task queue
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          command: deploy

      - name: Upload task gateway authentication secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          secrets: |
            BRAIN_SHARED_SECRET
        env:
          BRAIN_SHARED_SECRET: ${{ secrets.BRAIN_SHARED_SECRET }}
