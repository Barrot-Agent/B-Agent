name: Deploy A2A Worker

on:
  workflow_dispatch:
    inputs:
      confirm_external_deploy:
        description: "Select YES only after the deployment has been explicitly approved."
        required: true
        default: NO
        type: choice
        options:
          - NO
          - YES

permissions:
  contents: read

concurrency:
  group: barrot-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_external_deploy == 'YES'
    environment: barrot-production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          command: deploy

      - name: Upload secrets after deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          secrets: |
            GROQ_API_KEY
            BRAIN_SHARED_SECRET
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAIN_SHARED_SECRET: ${{ secrets.BRAIN_SHARED_SECRET }}
