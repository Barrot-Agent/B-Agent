name: Deploy A2A Worker (explicit approval required)

on:
  workflow_dispatch:
    inputs:
      confirm_external_change:
        description: "Set to YES only after explicit human approval for this specific external action."
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm_external_change == 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          command: deploy
      - name: Upload secrets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: a2a
          secrets: |
            GROQ_API_KEY
            BRAIN_SHARED_SECRET
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BRAIN_SHARED_SECRET: ${{ secrets.BRAIN_SHARED_SECRET }}
