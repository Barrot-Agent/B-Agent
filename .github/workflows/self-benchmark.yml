name: Self Benchmark

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run self-benchmark tasks
        run: python3 scripts/self_benchmark.py
      - name: Commit benchmark log
        run: |
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add ping-pongings/knowledge-base/benchmark_log.jsonl
          git diff --cached --quiet || git commit -m "Self-benchmark run [skip ci]"
          git push || (git pull --no-rebase --no-edit origin main && git push)
