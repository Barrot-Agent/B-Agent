name: Self Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run self-benchmark tasks
        run: python3 scripts/self_benchmark.py
      - name: Upload self-benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: self-benchmark-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/benchmark_log.jsonl
          if-no-files-found: warn
          retention-days: 7
