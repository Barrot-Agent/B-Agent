name: Self Benchmark

on:
  workflow_dispatch:
    inputs:
      confirm_external_research:
        description: "Explicitly authorize the Groq-backed self-benchmark run"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

jobs:
  benchmark:
    if: ${{ inputs.confirm_external_research == 'YES' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run self-benchmark tasks
        run: python3 scripts/self_benchmark.py
      - name: Preserve benchmark log as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrot-self-benchmark-${{ github.run_number }}
          path: ping-pongings/knowledge-base/benchmark_log.jsonl
          if-no-files-found: warn
          retention-days: 90
