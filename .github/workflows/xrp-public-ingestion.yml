name: XRP Public Market Ingestion

on:
  schedule:
    - cron: '3 * * * *'
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: xrp-public-market-ingestion
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare feature-store workspace
        run: mkdir -p artifacts/xrp_ingestion
      - name: Restore cumulative feature-store cache
        id: feature_cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/xrp_ingestion/feature_store.sqlite3
          key: xrp-feature-store-v1-${{ github.run_id }}
          restore-keys: |
            xrp-feature-store-v1-
      - name: Record cache restoration source
        if: steps.feature_cache.outputs.cache-matched-key != ''
        run: echo "BARROT_FEATURE_STORE_RESTORE_SOURCE=actions_cache" >> "$GITHUB_ENV"
      - name: Restore latest unexpired feature-store artifact on cache miss
        if: steps.feature_cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_record="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and .workflow_run.id != null and (.name | startswith("xrp-public-feature-"))) | [.created_at, (.workflow_run.id | tostring), .name] | @tsv' | sort | tail -n 1)"
          if [[ -z "$artifact_record" ]]; then
            echo "BARROT_FEATURE_STORE_RESTORE_SOURCE=bootstrap" >> "$GITHUB_ENV"
            echo "No unexpired feature-store backup artifact; bootstrapping."
            exit 0
          fi
          IFS=$'\t' read -r _ previous_run_id previous_artifact_name <<< "$artifact_record"
          gh run download "$previous_run_id" --name "$previous_artifact_name" --dir artifacts/xrp_ingestion
          test -s artifacts/xrp_ingestion/feature_store.sqlite3
          echo "BARROT_FEATURE_STORE_RESTORE_SOURCE=previous_feature_artifact:$previous_run_id" >> "$GITHUB_ENV"
      - name: Capture public XRP market sources and evaluate historical baselines
        run: python -m barrot_agent.evolution.xrp_public_ingestion --output-dir artifacts/xrp_ingestion
      - name: Save cumulative feature-store cache
        if: success() && steps.feature_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/xrp_ingestion/feature_store.sqlite3
          key: xrp-feature-store-v1-${{ github.run_id }}
      - name: Upload immutable raw-source receipts
        uses: actions/upload-artifact@v7
        with:
          name: xrp-public-raw-${{ github.run_id }}
          path: |
            artifacts/xrp_ingestion/raw/**
            artifacts/xrp_ingestion/receipt_manifest.json
            artifacts/xrp_ingestion/receipt_chain_manifest.json
            artifacts/xrp_ingestion/source_failures.json
            artifacts/xrp_ingestion/raw_only_sources.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload daily point-in-time feature-store backup and walk-forward report
        if: success() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '15 0 * * *')
        uses: actions/upload-artifact@v7
        with:
          name: xrp-public-feature-${{ github.run_id }}
          path: |
            artifacts/xrp_ingestion/feature_store.sqlite3
            artifacts/xrp_ingestion/snapshot.json
            artifacts/xrp_ingestion/walk_forward.json
            artifacts/xrp_ingestion/summary.json
            artifacts/xrp_ingestion/snapshot_blocked.json
          if-no-files-found: error
          retention-days: 90
