name: Auto-Resolve Workflow Issues (disabled pending explicit review)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: echo "Disabled: the previous batch workflow could comment on and close matching open issues based on workflow status. Re-enable only with per-issue authorization, auditable evidence and a protected approval boundary. No credentials are read and no repository mutation is performed."
