name: auto-resolve-issues (disabled pending reviewed automation policy)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "The previous batch workflow could comment on and close matching open issues based on workflow status. Re-enable only with per-issue authorization, auditable evidence and a protected approval boundary."
          echo "No credentials are read and no repository mutation is performed."
