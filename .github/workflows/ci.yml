name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  conflict-markers:
    name: Conflict Marker Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for unresolved merge conflict markers
        run: |
          FOUND=$(git ls-files --exclude-standard -- '*.py' '*.yml' '*.yaml' '*.toml' '*.sh' \
            | grep -v 'merge_conflict' \
            | xargs --no-run-if-empty grep -l -e '^<<<<<<< ' -e '^>>>>>>> ' 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: unresolved merge conflict markers found in:" >&2
            echo "$FOUND" >&2
            exit 1
          fi
          echo "OK: no conflict markers."

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      ROOT_PYTHON_TARGETS: app.py pingpong_emitter.py
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy pydantic pydantic-settings python-dotenv

      - name: Check formatting (black)
        run: black --check --diff $(find barrot_agent tests -type f -name '*.py' | sort) $ROOT_PYTHON_TARGETS

      - name: Check imports (isort)
        run: isort --check-only --diff $(find barrot_agent tests -type f -name '*.py' | sort) $ROOT_PYTHON_TARGETS

      - name: Lint (flake8)
        run: flake8 $(find barrot_agent tests -type f -name '*.py' | grep -v 'barrot_agent/rendering' | grep -v 'barrot_agent/smart_agent.py' | sort) $ROOT_PYTHON_TARGETS

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      ROOT_PYTHON_TARGETS: app.py pingpong_emitter.py
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pydantic pydantic-settings python-dotenv

      - name: Compile Python sources
        run: python -m compileall barrot_agent data $ROOT_PYTHON_TARGETS

      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=barrot_agent \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.10'
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run dependency audit
        # Rationale is documented in SECURITY.md under Known Dependency Audit
        # Exceptions so the ignore is tracked and periodically re-reviewed.
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-232
