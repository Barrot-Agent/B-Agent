name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    env:
      ROOT_PYTHON_TARGETS: app.py emit_pingpong.py pingpong_emitter.py
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort mypy pydantic pydantic-settings python-dotenv

      - name: Check formatting (black)
        run: black --check --diff $(find barrot_agent tests -type f -name '*.py' | sort) $ROOT_PYTHON_TARGETS

      - name: Check imports (isort)
        run: isort --check-only --diff $(find barrot_agent tests -type f -name '*.py' | sort) $ROOT_PYTHON_TARGETS

      - name: Lint (flake8)
        run: flake8 $(find barrot_agent tests -type f -name '*.py' | sort) $ROOT_PYTHON_TARGETS

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      ROOT_PYTHON_TARGETS: app.py emit_pingpong.py pingpong_emitter.py
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pydantic pydantic-settings python-dotenv

      - name: Compile Python sources
        run: python -m compileall barrot_agent data $ROOT_PYTHON_TARGETS

      - name: Run tests
        run: |
          pytest tests/ -v \
            --cov=barrot_agent \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.10'
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run dependency audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-232
