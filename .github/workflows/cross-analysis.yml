name: Cross Analysis

on:
  # Consume the exact authorized artifact after the manual Knowledge Signal Cycle.
  workflow_run:
    workflows: ["Knowledge Signal Cycle"]
    types: [completed]
    branches: [main]
  # Fallback cron analyzes the checked-in snapshot; freshness metadata marks stale inputs.
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact authorized knowledge-cycle artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: barrot-knowledge-signal-${{ github.event.workflow_run.run_number }}
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Entity co-occurrence
        run: python3 scripts/entity_cooccurrence.py

      - name: Sentiment shift detector
        run: python3 scripts/sentiment_shift.py

      - name: Entity sentiment profiler
        run: python3 scripts/entity_sentiment_profile.py

      - name: Upload read-only analysis outputs
        uses: actions/upload-artifact@v7
        with:
          name: cross-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ping-pongings/knowledge-base/entity_cooccurrence.json
            ping-pongings/knowledge-base/sentiment_shift.json
            ping-pongings/knowledge-base/entity_sentiment_profile.json
            web/entity_cooccurrence.json
            web/sentiment_shift.json
            web/entity_sentiment_profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Write run summary
        run: |
          {
            echo "## Cross Analysis"
            echo
            if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
              echo "Inputs were downloaded from the exact successful authorized Knowledge Signal Cycle run."
            else
              echo "This scheduled/manual fallback analyzes the checked-in snapshot; source freshness metadata must be inspected."
            fi
            echo "Outputs are attached as a read-only workflow artifact. No repository files are committed or pushed."
          } >> "$GITHUB_STEP_SUMMARY"
