name: Cross Analysis

on:
  # Analyze only after a successful Knowledge Signal Cycle on main.
  workflow_run:
    workflows: ["Knowledge Signal Cycle"]
    types: [completed]
    branches: [main]
  # Scheduled read-only refresh.
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Entity co-occurrence
        run: python3 scripts/entity_cooccurrence.py

      - name: Sentiment shift detector
        run: python3 scripts/sentiment_shift.py

      - name: Entity sentiment profiler
        run: python3 scripts/entity_sentiment_profile.py

      - name: Upload read-only analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: cross-analysis-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ping-pongings/knowledge-base/entity_cooccurrence.json
            ping-pongings/knowledge-base/sentiment_shift.json
            ping-pongings/knowledge-base/entity_sentiment_profile.json
            web/entity_cooccurrence.json
            web/sentiment_shift.json
            web/entity_sentiment_profile.json
          if-no-files-found: error
          retention-days: 30

      - name: Write run summary
        run: |
          {
            echo "## Cross Analysis"
            echo ""
            echo "Read-only analysis completed. Outputs are attached as a workflow artifact."
            echo "No repository files were committed or pushed."
          } >> "$GITHUB_STEP_SUMMARY"
