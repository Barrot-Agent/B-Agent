name: Audio Render Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "barrot_agent/creative/**"
      - "tests/test_musical_adapters.py"
      - "tests/test_audio_render_integration.py"
      - "tests/test_audio_production_quality_gates.py"
      - "pyproject.toml"
      - ".github/workflows/audio-render-integration.yml"
  push:
    branches: ["integration/**"]
    paths:
      - "barrot_agent/creative/**"
      - "tests/test_audio_render_integration.py"
      - "tests/test_audio_production_quality_gates.py"
      - "pyproject.toml"
      - ".github/workflows/audio-render-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fluidsynth-render:
    name: Full-song FluidR3 render, editable bundle, and QC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install FluidSynth and MIT-licensed FluidR3 General MIDI SoundFont
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfluidsynth3 fluid-soundfont-gm p7zip-full
          dpkg-query -W -f='${Package} ${Version}\n' libfluidsynth3 fluid-soundfont-gm
          SF2_VERSION="$(dpkg-query -W -f='${Version}' fluid-soundfont-gm)"
          SF2_PATH="/usr/share/sounds/sf2/FluidR3_GM.sf2"
          LICENSE_PATH="/usr/share/doc/fluid-soundfont-gm/copyright"
          test -s "$SF2_PATH"
          test -s "$LICENSE_PATH"
          echo "BARROT_TEST_SF2_SOURCE=Debian fluid-soundfont-gm ${SF2_VERSION}; FluidR3_GM by Frank Wen" >> "$GITHUB_ENV"
          echo "BARROT_TEST_SF2_LICENSE=MIT" >> "$GITHUB_ENV"
          echo "BARROT_TEST_SF2=$SF2_PATH" >> "$GITHUB_ENV"
          echo "BARROT_TEST_SF2_LICENSE_FILE=$LICENSE_PATH" >> "$GITHUB_ENV"
          sha256sum "$SF2_PATH" "$LICENSE_PATH"
          ldconfig -p | grep -i fluidsynth


      - name: Fetch two source-claimed CC0 FreePats SoundFonts for per-track routing
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/barrot-cc0-soundfonts"
          mkdir -p "$ROOT/upright" "$ROOT/old-piano"
          UPRIGHT_ARCHIVE="$ROOT/UprightPianoKW-small-SF2-20190703.7z"
          OLD_ARCHIVE="$ROOT/PianoFB-small-SF2-20200401.7z"
          UPRIGHT_URL="https://freepats.zenvoid.org/Piano/UprightPianoKW/UprightPianoKW-small-SF2-20190703.7z"
          OLD_URL="https://github.com/freepats/old-piano-FB/releases/download/2020-04-01/PianoFB-small-SF2-20200401.7z"
          curl --fail --location --retry 3 --connect-timeout 20 "$UPRIGHT_URL" -o "$UPRIGHT_ARCHIVE"
          curl --fail --location --retry 3 --connect-timeout 20 "$OLD_URL" -o "$OLD_ARCHIVE"
          7z t "$UPRIGHT_ARCHIVE" >/dev/null
          7z t "$OLD_ARCHIVE" >/dev/null
          7z x -y -o"$ROOT/upright" "$UPRIGHT_ARCHIVE" >/dev/null
          7z x -y -o"$ROOT/old-piano" "$OLD_ARCHIVE" >/dev/null
          mapfile -t UPRIGHT_FILES < <(find "$ROOT/upright" -type f -iname '*.sf2' | sort)
          mapfile -t OLD_FILES < <(find "$ROOT/old-piano" -type f -iname '*.sf2' | sort)
          test "${#UPRIGHT_FILES[@]}" -eq 1
          test "${#OLD_FILES[@]}" -eq 1
          UPRIGHT_SF2="${UPRIGHT_FILES[0]}"
          OLD_SF2="${OLD_FILES[0]}"
          test -s "$UPRIGHT_SF2"
          test -s "$OLD_SF2"
          FLUID_SHA="$(sha256sum "$BARROT_TEST_SF2" | awk '{print $1}')"
          UPRIGHT_SHA="$(sha256sum "$UPRIGHT_SF2" | awk '{print $1}')"
          OLD_SHA="$(sha256sum "$OLD_SF2" | awk '{print $1}')"
          test "$UPRIGHT_SHA" != "$OLD_SHA"
          test "$UPRIGHT_SHA" != "$FLUID_SHA"
          test "$OLD_SHA" != "$FLUID_SHA"
          sha256sum "$UPRIGHT_ARCHIVE" "$OLD_ARCHIVE" "$UPRIGHT_SF2" "$OLD_SF2"
          {
            echo "BARROT_TEST_SF2_ALT_UPRIGHT=$UPRIGHT_SF2"
            echo "BARROT_TEST_SF2_ALT_OLD=$OLD_SF2"
            echo "BARROT_TEST_SF2_ALT_UPRIGHT_ARCHIVE=$UPRIGHT_ARCHIVE"
            echo "BARROT_TEST_SF2_ALT_OLD_ARCHIVE=$OLD_ARCHIVE"
            echo "BARROT_TEST_SF2_ALT_UPRIGHT_SOURCE=https://freepats.zenvoid.org/Piano/acoustic-grand-piano.html"
            echo "BARROT_TEST_SF2_ALT_OLD_SOURCE=https://freepats.zenvoid.org/Piano/honky-tonk-piano.html"
            echo "BARROT_TEST_SF2_ALT_UPRIGHT_LICENSE=CC0-1.0"
            echo "BARROT_TEST_SF2_ALT_OLD_LICENSE=CC0-1.0"
            echo "BARROT_TEST_SF2_ALT_UPRIGHT_ARCHIVE_URL=$UPRIGHT_URL"
            echo "BARROT_TEST_SF2_ALT_OLD_ARCHIVE_URL=$OLD_URL"
          } >> "$GITHUB_ENV"

      - name: Install optional music runtime
        run: |
          python -m pip install --upgrade pip
          # Package initialization imports the signed ProjectStateLedger; install its core crypto dependency in this minimal audio runtime.
          python -m pip install pytest pytest-cov numpy scipy pretty_midi pyfluidsynth mido pyloudnorm==0.2.0 "cryptography>=44.0.0"

      - name: Run stereo render, full-song bundle, and technical QC
        env:
          BARROT_AUDIO_QC_OUTPUT: ${{ runner.temp }}/audio-render-qc.json
          BARROT_AUDIO_BUNDLE_QC_OUTPUT: ${{ runner.temp }}/audio-bundle-qc.json
          BARROT_AUDIO_FULL_SONG_QC_OUTPUT: ${{ runner.temp }}/audio-full-song-qc.json
          BARROT_AUDIO_FULL_SONG_ROUTED_OUTPUT: ${{ runner.temp }}/audio-full-song-keys-routed
          BARROT_AUDIO_FULL_SONG_ROUTED_QC_OUTPUT: ${{ runner.temp }}/audio-full-song-routed-qc.json
          BARROT_AUDIO_BUNDLE_OUTPUT: ${{ runner.temp }}/audio-production-bundle
          BARROT_AUDIO_SOUNDFONT_ROUTING_OUTPUT: ${{ runner.temp }}/audio-soundfont-routing
          BARROT_AUDIO_SOUNDFONT_ROUTING_QC_OUTPUT: ${{ runner.temp }}/audio-soundfont-routing-qc.json
        run: python -m pytest tests/test_audio_render_integration.py -v

      - name: Add attribution and import instructions to the production bundle
        if: success()
        run: |
          BUNDLE="${{ runner.temp }}/audio-production-bundle"
          mkdir -p "$BUNDLE/licenses"
          cp "$BARROT_TEST_SF2_LICENSE_FILE" "$BUNDLE/licenses/FluidR3_GM_Debian_Copyright.txt"
          cp "${{ runner.temp }}/audio-full-song-qc.json" "$BUNDLE/quality-control.json"
          SF2_SHA256="$(sha256sum "$BARROT_TEST_SF2" | awk '{print $1}')"
          LICENSE_SHA256="$(sha256sum "$BARROT_TEST_SF2_LICENSE_FILE" | awk '{print $1}')"
          cat > "$BUNDLE/README.md" <<EOF
          # Barrot full-song audio bundle

          This CI artifact contains a full-length stereo WAV mix, nine sample-aligned WAV stems, a Standard MIDI File with named tracks and section markers, JSON production metadata, and technical QC including ITU-R BS.1770-4 integrated LUFS, EBU R128 loudness range, crest factor, true peak, and stereo/stem checks. Loudness is measured only; no loudness normalization is applied.

          - Renderer: FluidSynth via pyfluidsynth
          - SoundFont: FluidR3_GM from Debian's fluid-soundfont-gm package
          - SoundFont author: Frank Wen and listed contributors
          - SoundFont license: MIT; the Debian copyright and license notice is in licenses/FluidR3_GM_Debian_Copyright.txt
          - SoundFont SHA-256: ${SF2_SHA256}
          - License-document SHA-256: ${LICENSE_SHA256}
          - The SoundFont binary itself is not included.

          Import composition.mid and the aligned files in stems/ into a DAW. mix.wav is the premaster reference render with a -6 dBFS headroom ceiling. metadata.json records tempo, key, meter, section map, sample alignment, hashes, and soundfont provenance.

          This is a reproducible technical reference render, not a native DAW project or a claim of professional mix/master quality. Instrument stems are rendered in separate synth passes; exact stem-sum reconstruction is not guaranteed, and the measured error/correlation are recorded in metadata.json and quality-control.json. Musical quality still requires comparative listening and user acceptance.
          EOF
          test -s "$BUNDLE/mix.wav"
          test -s "$BUNDLE/composition.mid"
          test -s "$BUNDLE/metadata.json"
          test -s "$BUNDLE/quality-control.json"
          test "$(find "$BUNDLE/stems" -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 9

      - name: Upload technical QC receipts
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audio-render-qc-${{ github.run_id }}
          path: ${{ runner.temp }}/audio-*-qc.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload editable full-song production bundle
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audio-production-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/audio-production-bundle/
          if-no-files-found: error
          retention-days: 30

      - name: Add attribution and A/B instructions to the routed full-song variant
        if: success()
        run: |
          BUNDLE="${{ runner.temp }}/audio-full-song-keys-routed"
          mkdir -p "$BUNDLE/licenses"
          cp "$BARROT_TEST_SF2_LICENSE_FILE" "$BUNDLE/licenses/FluidR3_GM_Debian_Copyright.txt"
          cp "${{ runner.temp }}/audio-full-song-routed-qc.json" "$BUNDLE/quality-control.json"
          cat > "$BUNDLE/README.md" <<EOF
          # Barrot full-song keys-routed comparison bundle

          This is a full-length timbral comparison against the baseline bundle from the same run. The composition and Standard MIDI file are identical; only the `keys` instrument uses the Upright Piano KW SoundFont. The other eight instruments continue to use FluidR3_GM.

          - Renderer: FluidSynth via pyfluidsynth
          - Keys SoundFont: FreePats Upright Piano KW; source page states CC0 1.0: https://freepats.zenvoid.org/Piano/acoustic-grand-piano.html
          - Other instruments: FluidR3_GM from Debian's fluid-soundfont-gm package; MIT notice is in licenses/FluidR3_GM_Debian_Copyright.txt
          - Both SoundFont binaries are omitted. SHA-256 values and source/license declarations are recorded in metadata.json.
          - The FreePats source/license declaration is caller-supplied metadata, not an independent legal audit.

          Import composition.mid and the aligned files in stems/ into a DAW. The QC file reports the playback gain offset required to match the baseline mix's measured integrated loudness; no gain or loudness normalization has been applied.

          This is an experimental timbral A/B, not a professional mix/master claim and not evidence of artistic improvement. No comparative listening or user acceptance has been performed. The baseline artifact from the same run is the control.
          EOF
          test -s "$BUNDLE/mix.wav"
          test -s "$BUNDLE/composition.mid"
          test -s "$BUNDLE/metadata.json"
          test -s "$BUNDLE/quality-control.json"
          test "$(find "$BUNDLE/stems" -maxdepth 1 -type f -name '*.wav' | wc -l)" -eq 9

      - name: Upload full-song keys-routed comparison bundle
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audio-production-bundle-keys-routed-${{ github.run_id }}
          path: ${{ runner.temp }}/audio-full-song-keys-routed/
          if-no-files-found: error
          retention-days: 30

      - name: Upload per-instrument SoundFont routing comparison
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audio-soundfont-routing-qc-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/audio-soundfont-routing/
            ${{ runner.temp }}/audio-soundfont-routing-qc.json
          if-no-files-found: error
          retention-days: 30
