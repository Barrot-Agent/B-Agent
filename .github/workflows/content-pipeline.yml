name: Content Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm_external_change:
        description: "Explicitly authorize this Groq-backed content generation run"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

jobs:
  draft:
    if: ${{ inputs.confirm_external_change == 'YES' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Draft content
        run: python3 scripts/content_pipeline.py
      - name: Preserve drafts as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrot-content-drafts-${{ github.run_number }}
          path: content/
          if-no-files-found: warn
          retention-days: 30
