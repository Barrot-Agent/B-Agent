name: Content Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Draft content
        run: python3 scripts/content_pipeline.py
      - name: Upload content-pipeline artifact
        uses: actions/upload-artifact@v4
        with:
          name: content-pipeline-${{ github.run_number }}
          path: |
            content/
          if-no-files-found: warn
          retention-days: 7
