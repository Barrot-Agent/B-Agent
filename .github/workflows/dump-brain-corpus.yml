name: Dump Brain Corpus
on:
  workflow_dispatch:
    inputs:
      confirm_private_data_processing:
        description: "Explicitly authorize this one-time export of the private Barrot brain corpus to a short-lived workflow artifact"
        required: true
        default: "NO"
permissions:
  contents: read
jobs:
  dump:
    if: inputs.confirm_private_data_processing == 'YES'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/dump_brain_corpus.py
        env:
          DATABRICKS_HOST: dbc-82d64fee-1c2e.cloud.databricks.com
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: c85b8f4fea8cd527
      - name: Upload explicitly authorized corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-corpus-${{ github.run_number }}
          path: brain_corpus/
          if-no-files-found: error
          retention-days: 1
