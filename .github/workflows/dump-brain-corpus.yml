name: Dump Brain Corpus (disabled pending data classification)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "Public brain-corpus export is disabled pending data classification, privacy review, and an approved non-public destination."
          echo "No credentials are read, no query is run, no files are written, and no repository push occurs."
