name: Barrot Superior Merge
on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Merged model name'
        required: true
        default: 'barrot-superior-v1'
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt update -y
          sudo apt install -y git-lfs
          python3 -m pip install --upgrade pip
          pip install -U mergekit==1.4.0 "huggingface_hub[cli]" transformers>=4.45.0 torch safetensors
      - name: Login HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli login --token $HF_TOKEN --add-to-git-credential
      - name: Merge
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          mergekit-yaml merges/barrot-superior/config.yaml output/${{ github.event.inputs.model_name }} \
            --copy-tokenizer --allow-crimes --out-shard-size 5B --lazy-unpickle --trust-remote-code --quiet
      - name: Verify
        run: ls -lah output/${{ github.event.inputs.model_name }}/*
      - name: Upload HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd output/${{ github.event.inputs.model_name }}
          huggingface-cli upload Barrot-Agent/${{ github.event.inputs.model_name }} . --repo-type model
