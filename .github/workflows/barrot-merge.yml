name: Barrot Superior Merge (quarantined; missing reviewed configuration)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        shell: bash
        run: |
          set -euo pipefail
          echo "The model-upload workflow is quarantined because merges/barrot-superior/config.yaml is absent."
          echo "No model merge, credential read, repository write, or Hugging Face upload is permitted."
          echo "Re-enablement requires a reviewed, committed merge configuration, pinned model revisions, dependency controls, and a separately scoped upload credential."
