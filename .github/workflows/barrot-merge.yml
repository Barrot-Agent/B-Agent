name: Barrot Superior Merge
on:
  workflow_dispatch:
    inputs:
      model_name:
        description: Merged model name
        required: true
        default: barrot-superior-v1
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -U "huggingface_hub[cli]" "mergekit>=0.0.4.6" safetensors sentencepiece protobuf
      - name: Merge with env token
        env:
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mergekit-yaml merges/barrot-superior/config.yaml output/${{ github.event.inputs.model_name }} \
            --copy-tokenizer --out-shard-size 2B --trust-remote-code --quiet
      - name: Verify
        run: ls -lah output/${{ github.event.inputs.model_name }}
      - name: Upload
        env:
          HUGGINGFACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli upload Barrot-Agent/${{ github.event.inputs.model_name }} output/${{ github.event.inputs.model_name }} .
