name: Barrot Superior Merge
on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Merged model name'
        required: true
        default: 'barrot-superior-v1'
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -U mergekit "huggingface_hub[cli]"
      - name: Merge
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mergekit-yaml merges/barrot-superior/config.yaml output/${{ github.event.inputs.model_name }} \
            --copy-tokenizer --allow-crimes --out-shard-size 1B --lazy-unpickle
      - name: Verify
        run: ls -lah output/${{ github.event.inputs.model_name }}
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: hf upload Barrot-Agent/${{ github.event.inputs.model_name }} output/${{ github.event.inputs.model_name }} .
