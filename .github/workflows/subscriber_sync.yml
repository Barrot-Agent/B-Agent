name: Barrot Subscriber Sync (disabled pending protected approval)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        shell: bash
        run: |
          set -euo pipefail
          echo "Disabled: prior hourly workflow read Gumroad customer emails, SHA-256 hashed them and committed the resulting list to public web/subscribers.json. The file contents were not inspected; privacy review is required."
          echo "No credentials are read and no external or repository mutation is performed."
