name: Barrot Auto-Merge PRs

on:
  schedule:
    # Run every 30 minutes to continuously merge new PRs
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Merge all open pull requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "=== Barrot Auto-Merge: starting pass ==="
          BLOCKED_LABEL="automerge:blocked"

          # Ensure blocked label exists (best effort)
          gh api "repos/$REPO/labels/$BLOCKED_LABEL" --silent >/dev/null 2>&1 || \
            gh api "repos/$REPO/labels" \
              --method POST \
              --field name="$BLOCKED_LABEL" \
              --field color="d93f0b" \
              --field description="PR is blocked from auto-merge (conflicts/checks/review required)" \
              --silent >/dev/null 2>&1 || true

          # Collect ALL open PR numbers using paginated REST API
          ALL_PRS=$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --paginate \
            --jq '.[].number' \
            2>/dev/null || true)

          if [ -z "$ALL_PRS" ]; then
            echo "No open pull requests found."
            exit 0
          fi

          MERGED=0
          SKIPPED=0
          FAILED=0

          for PR in $ALL_PRS; do
            echo ""
            echo "--- PR #$PR ---"

            # Fetch PR details
            PR_INFO=$(gh pr view "$PR" \
              --repo "$REPO" \
              --json title,mergeable,mergeStateStatus,state,headRefOid \
              2>/dev/null)

            STATE=$(echo "$PR_INFO" | jq -r '.state // ""')
            TITLE=$(echo "$PR_INFO" | jq -r '.title // ""')
            MERGEABLE=$(echo "$PR_INFO" | jq -r '.mergeable // ""')
            MERGE_STATE=$(echo "$PR_INFO" | jq -r '.mergeStateStatus // ""')
            HEAD_SHA=$(echo "$PR_INFO" | jq -r '.headRefOid // ""')

            if [ "$STATE" != "OPEN" ]; then
              echo "  PR #$PR is not open (state=$STATE). Skipping."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "  Title     : $TITLE"
            echo "  Mergeable : $MERGEABLE"
            echo "  State     : $MERGE_STATE"

            if [ "$MERGEABLE" = "CONFLICTING" ] || [ "$MERGE_STATE" = "DIRTY" ]; then
              echo "  ⚠️  Merge conflict detected; cannot auto-resolve."
              gh pr edit "$PR" --repo "$REPO" --add-label "$BLOCKED_LABEL" >/dev/null 2>&1 || true
              gh pr comment "$PR" --repo "$REPO" --body "⚠️ Auto-merge skipped: this PR has conflicts with the base branch and needs manual conflict resolution." >/dev/null 2>&1 || true
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Update branch via official GitHub API before merge attempt (best effort)
            if [ -n "$HEAD_SHA" ]; then
              UPDATE_OUTPUT=$(gh api \
                --method PUT \
                "repos/$REPO/pulls/$PR/update-branch" \
                --field expected_head_sha="$HEAD_SHA" 2>&1)
              UPDATE_EXIT=$?
              if [ $UPDATE_EXIT -eq 0 ]; then
                echo "  ✅ Branch updated against base branch."
              else
                if echo "$UPDATE_OUTPUT" | grep -qi "not modified\|already up to date\|update is not needed\|expected_head_sha"; then
                  echo "  ℹ️  Branch update not required."
                else
                  echo "  ⚠️  Branch update failed: $UPDATE_OUTPUT"
                fi
              fi
            fi

            # Try merge commit first, then squash, then rebase as fallbacks
            RESULT=""
            for STRATEGY in merge squash rebase; do
              echo "  Attempting --$STRATEGY…"
              OUTPUT=$(gh pr merge "$PR" \
                --repo "$REPO" \
                --"$STRATEGY" \
                2>&1)
              EXIT=$?
              echo "  $OUTPUT"
              if [ $EXIT -eq 0 ]; then
                RESULT="ok"
                break
              fi
              # Treat "already merged" as success
              if echo "$OUTPUT" | grep -qi "already merged"; then
                RESULT="ok"
                break
              fi
            done

            if [ "$RESULT" = "ok" ]; then
              gh pr edit "$PR" --repo "$REPO" --remove-label "$BLOCKED_LABEL" >/dev/null 2>&1 || true
              echo "  ✅ PR #$PR merged."
              MERGED=$((MERGED + 1))
            else
              gh pr edit "$PR" --repo "$REPO" --add-label "$BLOCKED_LABEL" >/dev/null 2>&1 || true
              echo "  ⚠️  PR #$PR could not be merged now (will retry next cycle)."
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=== Pass complete: merged=$MERGED  skipped=$SKIPPED  failed=$FAILED ==="
