name: Barrot Auto-Merge PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to enable auto-merge for"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge for one pull request
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.inputs.pr_number }}
        run: |
          if [ -z "$PR" ]; then
            echo "::error::No PR number provided"
            exit 1
          fi
          PR_INFO=$(gh pr view "$PR" --repo "$REPO" --json state,mergeable,reviewDecision,statusCheckRollup,title)
          echo "$PR_INFO"
          STATE=$(echo "$PR_INFO" | jq -r '.state')
          MERGEABLE=$(echo "$PR_INFO" | jq -r '.mergeable')
          REVIEW_DECISION=$(echo "$PR_INFO" | jq -r '.reviewDecision')
          BLOCKING_CHECKS=$(echo "$PR_INFO" | jq '[.statusCheckRollup[]? | select((.conclusion // "") != "" and (.conclusion | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))] | length')
          PENDING_CHECKS=$(echo "$PR_INFO" | jq '[.statusCheckRollup[]? | select((.conclusion // "") == "")] | length')
          if [ "$STATE" != "OPEN" ]; then
            echo "::error::PR #$PR is not open"
            exit 1
          fi
          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "::error::PR #$PR is not mergeable ($MERGEABLE)"
            exit 1
          fi
          if [ "$REVIEW_DECISION" != "APPROVED" ]; then
            echo "::error::PR #$PR is not approved ($REVIEW_DECISION)"
            exit 1
          fi
          if [ "$BLOCKING_CHECKS" -ne 0 ] || [ "$PENDING_CHECKS" -ne 0 ]; then
            echo "::error::PR #$PR has failing or pending checks"
            exit 1
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --squash --delete-branch
