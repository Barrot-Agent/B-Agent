name: Barrot Auto-Merge PRs (disabled pending verified gates)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  disabled:
    name: Fail-closed notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled automatic merge
        run: |
          echo "Automatic merging is disabled pending independently verified merge gates."
          echo "No pull request was merged or modified."
