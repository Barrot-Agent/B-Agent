name: Barrot Auto-Merge PRs (disabled; report-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report_only:
    name: Confirm automatic merging is disabled
    runs-on: ubuntu-latest
    steps:
      - name: Report safety state
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic pull-request merging is disabled in this workflow."
          echo "This workflow performs no approvals, label changes, status writes, branch updates, or merges."
          echo "Re-enabling automation requires independent review, required-check verification, branch-protection verification, and explicit owner approval."
