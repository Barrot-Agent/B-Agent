name: Barrot Auto-Merge PRs (disabled pending verified gates)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  disabled:
    name: Fail-closed notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled automatic merge
        run: |
          echo "Automatic PR merging is disabled pending independently verified merge gates."
          echo "This workflow performs no checkout, status write, comment, label change, or merge."
