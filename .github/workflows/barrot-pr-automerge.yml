name: Barrot Auto-Merge PRs (disabled pending reviewed safeguards)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  read-only-status:
    runs-on: ubuntu-latest
    steps:
      - name: State the merge safety boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic merging is disabled in this candidate."
          echo "This workflow performs no API writes, labels, approvals, or merges."
          echo "A maintainer must review branch protection and mandatory checks before any merge automation is reintroduced."
