name: Barrot Auto-Merge PRs

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to enable auto-merge for"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  automerge:
    name: Enable auto-merge for one pull request
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.inputs.pr_number }}
        run: |
          if [ -z "$PR" ]; then
            echo "::error::No PR number provided"
            exit 1
          fi
          gh pr view "$PR" --repo "$REPO" --json state,mergeable,title
          gh pr merge "$PR" --repo "$REPO" --auto --squash --delete-branch
