name: Barrot Auto-Merge PRs (Disabled Pending Governance Repair)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  disabled:
    name: Automatic merging disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled automation
        run: |
          echo "Automatic PR merging is disabled pending independent review and required CI gates."
          echo "This workflow is read-only and cannot merge, label, approve, comment, or change statuses."
