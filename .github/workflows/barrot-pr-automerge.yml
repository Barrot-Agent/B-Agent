name: Barrot Auto-Merge PRs (disabled pending verified gates)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  disabled:
    name: Automatic merging disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled automatic merge
        shell: bash
        run: |
          set -euo pipefail
          echo "Automatic PR merging is disabled pending independently verified merge gates."
          echo "This workflow does not approve, label, or merge pull requests."
          echo "No repository content was changed by this workflow."
