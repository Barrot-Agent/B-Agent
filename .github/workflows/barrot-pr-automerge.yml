name: Barrot Auto-Merge PRs (DISABLED — read-only audit)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Report open PRs without mutations
    runs-on: ubuntu-latest
    steps:
      - name: Read-only PR inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "AUTOMATIC MERGING IS DISABLED IN THIS CANDIDATE."
          echo "This workflow only reads and reports; it never merges, labels, comments, or updates branches."
          ROWS="$(gh api "repos/${REPO}/pulls?state=open&per_page=100" --paginate --jq '.[] | [.number, (.draft | tostring), .head.sha, .base.ref, .title] | @tsv')"
          if [[ -z "${ROWS}" ]]; then
            echo "No open pull requests found."
          else
            printf '%s\n' "${ROWS}"
          fi
