name: Free Image Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Image prompt'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      IMAGE_PROMPT: ${{ github.event.inputs.prompt }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate image (free, ZeroGPU)
        run: python3 free_image_gen.py
      - name: Upload free-image-generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-image-generation-${{ github.run_number }}
          path: |
            generated_images/
          if-no-files-found: warn
          retention-days: 7
