name: Free Image Generation

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Image prompt'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate image (free, ZeroGPU)
        env:
          IMAGE_PROMPT: ${{ inputs.prompt }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 scripts/free_image_gen.py

      - name: Retain generated image as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrot-free-image-${{ github.run_id }}
          path: generated_images/*.webp
          if-no-files-found: error
          retention-days: 30
