name: Barrot Task Allocator (Disabled Pending Verified Adapters)

on:
  push:
    branches: ["safety/**"]
  workflow_dispatch:
    inputs:
      goal:
        description: "Retained for reference; allocation is disabled until verified least-privilege adapters and branch/PR-only publication are implemented."
        required: true
        type: string

permissions: {}

jobs:
  report-disabled-state:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report disabled state
        run: echo "TASK_ALLOCATION_NOT_PERFORMED: no providers were called and no repository state was changed."
