name: Barrot Task Allocator

on:
  workflow_dispatch:
    inputs:
      goal:
        description: "Refactor goal for Barrot to split across barrot/gpt/ibm_bob"
        required: true
      confirm:
        description: "Authorize one allocation run; generated worker pull requests remain draft"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  allocate:
    if: ${{ inputs.confirm == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHATGPT_TOKEN: ${{ secrets.CHATGPT_TOKEN }}
      REFACTOR_GOAL: ${{ github.event.inputs.goal }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Configure git identity
        run: |
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
      - name: Allocate and dispatch
        run: python3 scripts/barrot_task_allocator.py
      - name: Preserve allocation outputs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barrot-task-allocation-${{ github.run_id }}
          path: |
            allocation_run_*.json
            tasks/
          if-no-files-found: ignore
          retention-days: 30
