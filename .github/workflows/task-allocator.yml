name: Barrot Task Allocator (quarantined)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous allocator loaded model and GitHub credentials, accepted a free-form goal, inspected secret names, and committed allocation records directly to main."
          echo "It is disabled until a branch-only, least-privilege, reviewable task-allocation flow is implemented."
          echo "The allocator script and existing task records are preserved. No credentials are loaded and no repository mutation occurs."
