name: Semantic Memory Index

on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install numpy
      - name: Build semantic index
        run: python3 scripts/semantic_memory.py
      - name: Commit
        run: |
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add ping-pongings/knowledge-base/semantic_memory.jsonl
          git diff --cached --quiet || git commit -m "Semantic memory indexing cycle [skip ci]"
          git push || (git pull --no-rebase --no-edit origin main && git push)
