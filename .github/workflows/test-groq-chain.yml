name: Test Groq Chain (quarantined pending explicit data-sharing policy)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous test workflow sent a free-form headline to Groq without an explicit per-run public/authorized-data confirmation or exact source revision."
          echo "The default example headline is not source evidence and must not be treated as a verified XRP event."
          echo "No provider credentials are read and no external request or repository mutation occurs."
