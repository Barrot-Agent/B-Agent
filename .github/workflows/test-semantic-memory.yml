name: Test Semantic Memory (quarantined pending explicit data-sharing authorization)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous test workflow sent a caller-supplied query to Groq using a repository secret without an explicit per-run data-sharing confirmation."
          echo "It remains disabled until public/authorized-input confirmation and a least-privilege, artifact-only contract are implemented."
          echo "No provider credentials are read and no external request or repository mutation occurs."
