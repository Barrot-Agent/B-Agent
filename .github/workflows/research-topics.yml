name: Research Topics

on:
  workflow_dispatch:
    inputs:
      confirm_external_research:
        description: "Explicitly authorize Groq-backed topic research"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

jobs:
  research:
    if: ${{ inputs.confirm_external_research == 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate research topics
        run: python scripts/research_topics.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Preserve topic log as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrot-research-topics-${{ github.run_number }}
          path: ping-pongings/knowledge-base/topics_log.jsonl
          if-no-files-found: warn
          retention-days: 90
