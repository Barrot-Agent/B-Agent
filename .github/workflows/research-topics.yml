name: Research Topics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/research_topics.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Upload research-topics artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-topics-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/topics_log.jsonl
          if-no-files-found: warn
          retention-days: 7
