name: Barrot Self-Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit_and_upgrade:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config user.name "Barrot Self-Upgrade"
          git config user.email "barrot-self-upgrade@users.noreply.github.com"

      - name: Record checked-out commit
        run: echo "BARROT_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Capability audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/barrot_capability_audit.py

      - name: Self-upgrade
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/barrot_self_upgrade.py

      - name: Persist generated audit for review
        run: python3 scripts/barrot_self_upgrade.py --persist-audit-report

      - name: Verify source checkout was not advanced
        run: |
          local_sha="$(git rev-parse HEAD)"
          echo "Initial checkout SHA: $BARROT_CHECKOUT_SHA"
          echo "Final checkout SHA: $local_sha"
          if [ -z "$BARROT_CHECKOUT_SHA" ] || [ "$local_sha" != "$BARROT_CHECKOUT_SHA" ]; then
            echo "Audit workflow unexpectedly changed its checked-out ref." >&2
            exit 1
          fi
          echo "Audit candidate remote SHA and review PR are verified by the persistence command."

      - name: Final state
        run: |
          echo "Final checkout SHA: $(git rev-parse HEAD)"
          git status --short
