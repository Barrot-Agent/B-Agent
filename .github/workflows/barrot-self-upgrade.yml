name: Barrot Self-Upgrade

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Authorize one self-upgrade run; proposed code changes must remain in a draft pull request"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  audit_and_upgrade:
    if: ${{ inputs.confirm == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config user.name "Barrot Self-Upgrade"
          git config user.email "barrot-self-upgrade@users.noreply.github.com"

      - name: Capability audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/barrot_capability_audit.py

      - name: Self-upgrade
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/barrot_self_upgrade.py

      - name: Validate generated audit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("barrot_capability_audit.json").read_text(encoding="utf-8"))
          if report.get("status") != "VERIFIED":
              raise SystemExit("Capability audit is not VERIFIED")
          print("Capability audit JSON validated; no repository ref was changed.")
          PY

      - name: Preserve audit as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barrot-capability-audit-${{ github.run_id }}
          path: barrot_capability_audit.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Final state
        run: |
          echo "Final SHA: $(git rev-parse HEAD)"
          git status --short
