name: Barrot Self-Upgrade (disabled pending protected approval)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        shell: bash
        run: |
          set -euo pipefail
          echo "Disabled: prior workflow had contents/pull-request write permissions, provider credentials and a push path to the dispatched ref including potential main."
          echo "No credentials are read and no external or repository mutation is performed."
