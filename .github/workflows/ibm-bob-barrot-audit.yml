name: IBM Bob Barrot Architecture Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOBSHELL_API_KEY: ${{ secrets.IBM_BOB_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install IBM Bob Shell
        timeout-minutes: 5
        run: |
          curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash -s -- --pm npm
          bob --version

      - name: Audit Barrot
        timeout-minutes: 20
        run: |
          bob run \
            --mode ask \
            --auth-method api-key \
            --accept-license \
            --disable-mcp \
            --disable-tool-groups edit,execute \
            --max-turns 15 \
            --max-cost 2 \
            --hide-intermediary-output \
            "Perform a comprehensive read-only architecture and engineering audit of this repository. Do not modify files. Analyze agent orchestration, A2A communication, memory and persistence, security boundaries, testing, failure recovery, deployment readiness, scalability, and unnecessary complexity. Identify strengths, critical weaknesses, missing capabilities, and the highest-value improvements ranked by impact versus effort. Cite relevant files and components where possible. End with a phased implementation roadmap." \
            > IBM_BOB_BARROT_AUDIT.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibm-bob-barrot-audit
          path: IBM_BOB_BARROT_AUDIT.md
