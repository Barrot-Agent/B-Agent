name: IBM Bob — Barrot Architecture Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      BOB_API_KEY: ${{ secrets.IBM_BOB_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - name: Install IBM Bob Shell
        run: |
          # Install Bob Shell using IBM's current installer/documented method.
          # This step will be adjusted if the repository's runner environment
          # requires a different package installation command.
          npm install -g @ibm/bob-shell

      - name: Audit Barrot architecture
        run: |
          bob run \
            --mode ask \
            --disable-tool-groups edit,execute \
            --disable-mcp \
            --max-turns 20 \
            "Perform a comprehensive READ-ONLY architecture and engineering audit of this B-Agent repository. Do not modify files or execute commands. Analyze agent orchestration, A2A communication, memory and persistence, security boundaries, testing, failure recovery, deployment readiness, scalability, and unnecessary complexity.

            Identify the strongest parts, critical weaknesses, missing capabilities, and the highest-value improvements ranked by impact versus effort. Cite relevant files and components where possible. Preserve working systems and prefer simple, reliable architecture over novelty. End with a phased implementation roadmap. This is analysis only; do not implement changes." \
            > IBM_BOB_BARROT_AUDIT.md

      - uses: actions/upload-artifact@v4
        with:
          name: ibm-bob-barrot-audit
          path: IBM_BOB_BARROT_AUDIT.md
