name: IBM Bob Barrot Architecture Audit

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      IBM_BOB_API_KEY: ${{ secrets.IBM_BOB_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install IBM Bob Shell
        run: |
          curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash
          bob --version

      - name: Audit Barrot
        run: |
          bob run --mode ask --accept-license \
          "Perform a read-only architecture and engineering audit of this repository. Do not modify files. Analyze agent orchestration, A2A communication, memory, persistence, security, testing, failure recovery, deployment readiness, scalability, and unnecessary complexity. Identify strengths, critical weaknesses, missing capabilities, and improvements ranked by impact versus effort. Cite relevant files where possible and end with a phased implementation roadmap." \
          > IBM_BOB_BARROT_AUDIT.md

      - uses: actions/upload-artifact@v4
        with:
          name: ibm-bob-barrot-audit
          path: IBM_BOB_BARROT_AUDIT.md
