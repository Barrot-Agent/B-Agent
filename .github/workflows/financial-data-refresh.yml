name: Financial Data Refresh

on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Refresh financial data
        run: python3 scripts/financial_data_refresh.py
      - name: Upload refreshed financial data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-data-refresh-${{ github.run_id }}
          path: |
            ping-pongings/knowledge-base/financial_data.json
            web/financial_data.json
          if-no-files-found: warn
          retention-days: 30
