name: Barrot Cognitive PingPong Diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only diagnostic"
        required: false
        default: diagnostic
        type: choice
        options:
          - diagnostic

permissions:
  contents: read

concurrency:
  group: barrot-cognitive-pingpong-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Read-only cognitive workflow diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate truthful diagnostic artifact
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          report = {
              "schema_version": "1.0",
              "status": "READ_ONLY_DIAGNOSTIC",
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "repository_commit": commit,
              "cognitive_analysis": "NOT_PERFORMED",
              "checks": {
                  "provider_calls": "NONE",
                  "repository_mutations": "NONE",
                  "issues_or_pull_requests_created": "NONE",
                  "commits_or_pushes": "NONE",
                  "cognitive_quality_score": None
              },
              "explanation": (
                  "The former workflow emitted fixed high/optimal labels and "
                  "committed generated text; those labels were not measured "
                  "cognitive metrics. This artifact records only verifiable "
                  "execution facts."
              )
          }
          output = Path("reports/cognitive-pingpong-diagnostic.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-pingpong-diagnostic-${{ github.run_id }}
          path: reports/cognitive-pingpong-diagnostic.json
          if-no-files-found: error
          retention-days: 30
