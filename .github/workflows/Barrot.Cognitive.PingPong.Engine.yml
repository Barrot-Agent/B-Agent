name: Barrot Cognitive PingPong — Simulated Heartbeat Only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Heartbeat report label; no model execution occurs"
        required: false
        default: "diagnostic"
        type: choice
        options:
          - diagnostic
          - manual
          - auto
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: barrot-cognitive-heartbeat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Emit non-claiming heartbeat record
        env:
          HEARTBEAT_MODE: ${{ inputs.mode || 'scheduled' }}
        run: |
          set -euo pipefail
          mkdir -p memory-bundles
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > memory-bundles/cognitive-relay.md <<EOF
          # Barrot Cognitive Heartbeat
          Timestamp: ${timestamp}
          Mode: ${HEARTBEAT_MODE}
          Status: SIMULATED_HEARTBEAT_ONLY
          Model execution: NOT_EXECUTED
          Provider calls: 0
          No cognitive-quality, learning-rate, latency or signal-strength measurement was performed.
          EOF
          cat > memory-bundles/cognitive-metrics.json <<EOF
          {
            "timestamp": "${timestamp}",
            "mode": "${HEARTBEAT_MODE}",
            "cycle_type": "simulated_heartbeat",
            "analysis_status": "NOT_EXECUTED",
            "provider_calls": 0,
            "latency_ms": null,
            "quality": "NOT_MEASURED",
            "learning_rate": "NOT_MEASURED",
            "signal_strength": "NOT_MEASURED"
          }
          EOF

      - name: Upload heartbeat artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrot-cognitive-heartbeat-${{ github.run_id }}
          path: memory-bundles/
          if-no-files-found: error
          retention-days: 30
