name: Barrot Cognitive PingPong Engine (DESIGN-ONLY — no live providers verified)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-audit:
    name: Report verified platform capability status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository read-only
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Emit explicit non-collaboration status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          platforms = [
              "ChatGPT", "Claude", "Grok", "Gemini", "Copilot",
              "Codex", "Hugging Face", "Kaggle", "Databricks"
          ]
          report = {
              "workflow": "Barrot Cognitive PingPong Engine",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "mode": "read_only_capability_audit",
              "live_collaboration_verified": False,
              "external_api_calls_made": False,
              "repository_writes_performed": False,
              "platforms": {
                  name: "designed_only_not_live_verified_by_this_workflow"
                  for name in platforms
              },
              "note": (
                  "This workflow does not contact external AI providers, "
                  "does not receive agent replies, and does not establish live collaboration."
              )
          }
          print(json.dumps(report, indent=2))
          PY
