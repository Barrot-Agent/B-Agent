name: Barrot Cognitive Relay Status (Read Only)

on:
  workflow_dispatch:

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Emit truthful platform-adapter status
        shell: bash
        run: |
          cat > cognitive-relay-status.json <<'JSON'
          {
            "schema_version": 1,
            "status": "NOT_IMPLEMENTED",
            "live_collaboration_verified": false,
            "external_calls_made": false,
            "persistent_research_state_written": false,
            "target_platforms": [
              "ChatGPT",
              "Claude",
              "Grok",
              "Gemini",
              "Copilot",
              "Codex",
              "Hugging Face",
              "Kaggle",
              "Databricks"
            ],
            "verified_external_platform_adapters": [],
            "reason": "The previous workflow emitted static ping/pong strings without calling external model APIs. Its jobs ran on isolated workers, and the commit job did not download their outputs. No cross-platform deliberation, handoff, or learning was verified.",
            "next_requirement": "Implement least-privilege authenticated adapters, capture request/response provenance, and verify each handoff before reporting collaboration."
          }
          JSON
          cat cognitive-relay-status.json

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-relay-status-${{ github.run_id }}
          path: cognitive-relay-status.json
          if-no-files-found: error
          retention-days: 14
