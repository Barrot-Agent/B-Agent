name: Barrot Cognitive PingPong Engine (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Report verified capability boundary
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/cognitive-pingpong-status.md <<'EOF'
          # Barrot Cognitive PingPong Status

          **Status:** NOT_IMPLEMENTED

          The former workflow emitted hard-coded PING/PONG text and static labels.
          It did not invoke a reasoning model, did not pass outputs between isolated
          jobs, and its commit job checked out a separate workspace. Therefore it
          did not establish a persistent cognitive learning loop.

          This diagnostic workflow is manual-only and read-only. No schedule,
          push trigger, repository write, issue mutation, PR mutation, or merge
          is performed. A real multi-agent deliberation protocol requires
          authenticated adapters, structured evidence exchange, provenance,
          disagreement retention, and independent verification.
          EOF
          cat artifacts/cognitive-pingpong-status.md

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-pingpong-status-${{ github.run_id }}
          path: artifacts/cognitive-pingpong-status.md
          if-no-files-found: error
          retention-days: 30
