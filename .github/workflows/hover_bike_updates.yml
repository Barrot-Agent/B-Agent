name: Hover Bike Updates

on:
  push:
    paths:
      - 'hover_bike_revolution/**'
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-artefacts:
    name: Generate design artefacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip

      - name: Generate hover bike design artefacts
        working-directory: hover_bike_revolution
        run: |
          python src/hover_bike_generator.py
          python src/magnetic_system_designer.py > /tmp/magnetic_report.json
          python src/propulsion_simulator.py    > /tmp/propulsion_report.json
          python src/power_management_system.py > /tmp/power_report.json
          echo "✅ Design artefacts generated"

      - name: Run simulations
        working-directory: hover_bike_revolution
        run: |
          python simulations/magnetic_field_sim.py
          python simulations/power_consumption_sim.py
          python simulations/stability_analysis.py
          python simulations/flight_dynamics_sim.py
          echo "✅ Simulations complete"

      - name: Generate documentation
        working-directory: hover_bike_revolution
        run: |
          python src/assembly_guide_generator.py
          echo "✅ Documentation generated"

      - name: Estimate print cost
        working-directory: hover_bike_revolution
        run: |
          python tools/cost_calculator.py
          python tools/print_estimator.py
          echo "✅ Cost estimates generated"

      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: hover-bike-artefacts-${{ github.run_number }}
          path: |
            hover_bike_revolution/hover_bike_spec.json
            hover_bike_revolution/component_geometry.json
            hover_bike_revolution/assembly_guide.md
            hover_bike_revolution/bill_of_materials.md
          retention-days: 30
