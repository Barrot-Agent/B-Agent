name: Barrot Operations Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm_external_change:
        description: "Set to YES only after explicit human approval for this specific run"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      confirm_databricks_workspace_import:
        description: "Set to YES only to authorize overwriting /Shared/barrot_databricks_job in Databricks for this run."
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      confirm_kaggle_dataset_download:
        description: "Set to YES only to authorize downloading the named Kaggle dataset into this runner for this run."
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      expected_source_sha:
        description: "Expected exact main commit approved for this external operations run"
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: barrot-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-platforms:
    if: ${{ inputs.confirm_external_change == 'YES' && github.ref == 'refs/heads/main' && (inputs.confirm_databricks_workspace_import == 'YES' || inputs.confirm_kaggle_dataset_download == 'YES') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact approved main commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Dispatch from main is required"; exit 1; }
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::A full main SHA is required"; exit 1; }
          git fetch --no-tags --depth=1 origin main
          actual="$(git rev-parse HEAD)"
          current="$(git rev-parse FETCH_HEAD)"
          [[ "$actual" == "$EXPECTED_SOURCE_SHA" && "$current" == "$EXPECTED_SOURCE_SHA" ]] || { echo "::error::Main differs from the approved SHA"; exit 1; }

      # Hugging Face deployment is owned by sync-huggingface.yml.
      # Do not push the GitHub repository's main branch directly to the Space:
      # the Space has its own history and hf_space/ is the intended deploy source.

      - name: Setup Databricks CLI
        if: ${{ inputs.confirm_databricks_workspace_import == 'YES' }}
        uses: databricks/setup-cli@9625fdde9ba2607df0087e0d3ec7449198bf2180 # v1.23.0; signed upstream commit

      - name: Run Databricks Job
        if: ${{ inputs.confirm_databricks_workspace_import == 'YES' }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::warning::DATABRICKS_HOST or DATABRICKS_TOKEN not set, skipping notebook upload"
            exit 0
          fi
          databricks workspace import src/barrot_databricks_job.py /Shared/barrot_databricks_job --language PYTHON --overwrite || \
            echo "::warning::Notebook upload failed; skipping upload-only step"

      - name: Kaggle Data Refresh
        if: ${{ inputs.confirm_kaggle_dataset_download == 'YES' }}
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          if [ -z "$KAGGLE_JSON" ]; then
            echo "::warning::KAGGLE_JSON not set, skipping Kaggle refresh"
            exit 0
          fi
          pip install kaggle
          export KAGGLE_CONFIG_DIR="$RUNNER_TEMP/.kaggle"
          mkdir -p "$KAGGLE_CONFIG_DIR"
          printf '%s' "$KAGGLE_JSON" > "$KAGGLE_CONFIG_DIR/kaggle.json"
          chmod 600 "$KAGGLE_CONFIG_DIR/kaggle.json"
          kaggle datasets download scribedpengenius/barrot-kaggle-featured --unzip
