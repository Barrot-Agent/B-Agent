name: Barrot Operations Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy HF Space
        run: |
          git remote add hf https://Scribedpengenius:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Scribedpengenius/barrot-omega || true
          git push hf main --force

      - name: Run Databricks Job
        uses: databricks/run-notebook@v1
        with:
          local-notebook-path: src/barrot_databricks_job.py
          databricks-host: ${{ secrets.DATABRICKS_HOST }}
          databricks-token: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Kaggle Data Refresh
        run: |
          pip install kaggle
          echo '${{ secrets.KAGGLE_JSON }}' > kaggle.json
          chmod 600 kaggle.json
          kaggle datasets download scribedpengenius/barrot-kaggle-featured --unzip
