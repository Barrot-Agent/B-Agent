name: Barrot Operations Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm_databricks_workspace_create:
        description: "Set YES only to create the notebook when the target path is confirmed absent. Existing targets are never overwritten."
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      confirm_kaggle_dataset_download:
        description: "Set YES only to download the public dataset to this ephemeral runner. This workflow never submits Kaggle entries."
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

concurrency:
  group: barrot-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  databricks-create:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_databricks_workspace_create == 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Databricks CLI v1.25.0
        uses: databricks/setup-cli@4f41a4c5291b531c1bb1e5760d677999cd484f89 # v1.25.0

      - name: Verify target absence and create without overwrite
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DATABRICKS_HOST}" ] || [ -z "${DATABRICKS_TOKEN}" ]; then
            echo "::error::DATABRICKS_HOST or DATABRICKS_TOKEN is missing; refusing workspace mutation."
            exit 1
          fi

          host="${DATABRICKS_HOST%/}"
          case "${host}" in
            https://*|http://*) ;;
            *) host="https://${host}" ;;
          esac

          target="/Shared/barrot_databricks_job"
          status_file="$(mktemp)"
          trap 'rm -f "${status_file}"' EXIT
          status_code="$(curl --silent --show-error --output "${status_file}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            --get --data-urlencode "path=${target}" \
            "${host}/api/2.0/workspace/get-status")"

          case "${status_code}" in
            404)
              echo "Target is absent. Create-only import may proceed."
              ;;
            200)
              echo "::error::Target already exists. Refusing to overwrite; no workspace mutation performed."
              exit 1
              ;;
            *)
              echo "::error::Could not verify target absence (HTTP ${status_code}). Refusing mutation."
              cat "${status_file}"
              exit 1
              ;;
          esac

          sha256sum src/barrot_databricks_job.py
          databricks workspace import src/barrot_databricks_job.py "${target}" --language PYTHON

  kaggle-download:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_kaggle_dataset_download == 'YES' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download public Kaggle dataset to ephemeral runner
        env:
          KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_JSON}" ]; then
            echo "::error::KAGGLE_JSON is missing; refusing Kaggle API access."
            exit 1
          fi
          python -m pip install "kaggle==1.7.4.5"
          export KAGGLE_CONFIG_DIR="${RUNNER_TEMP}/.kaggle"
          mkdir -p "${KAGGLE_CONFIG_DIR}" "${RUNNER_TEMP}/barrot-kaggle-featured"
          printf '%s' "${KAGGLE_JSON}" > "${KAGGLE_CONFIG_DIR}/kaggle.json"
          chmod 600 "${KAGGLE_CONFIG_DIR}/kaggle.json"
          kaggle datasets download scribedpengenius/barrot-kaggle-featured \
            --path "${RUNNER_TEMP}/barrot-kaggle-featured" --unzip
