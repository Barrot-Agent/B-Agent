name: Databricks Bundle Deploy (quarantined pending exact-revision deployment gate)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous workflow could deploy a Databricks bundle and run a job after a YES input but did not verify an exact approved main SHA."
          echo "It remains disabled until main-only dispatch, exact-main-SHA verification, deployment-scope review and separate run authorization are enforced."
          echo "No Databricks credentials are read, no deployment occurs, and no job is started."
