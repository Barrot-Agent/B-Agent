name: Sub-Agent Matrix (quarantined pending authenticated platform coordination)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous matrix sent arbitrary subtask prompts to Groq using a repository secret."
          echo "Groq is not one of the nine requested platforms, and no approved data-sharing boundary or persistent authenticated data-flow map exists."
          echo "It is disabled until a least-privilege, explicitly approved, branch-only evidence exchange is implemented."
          echo "No provider credentials are read and no external request or repository mutation occurs."
