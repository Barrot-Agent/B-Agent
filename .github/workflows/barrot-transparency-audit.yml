name: Barrot Transparency Audit (artifact only)

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run apex_lattice audit (no PR side effects)
        run: python3 scripts/apex_audit_summary.py
      - name: Summarize self-benchmark history
        run: python3 scripts/benchmark_summary.py
      - name: Upload audit summaries
        uses: actions/upload-artifact@v4
        with:
          name: barrot-transparency-audit-${{ github.run_id }}
          path: |
            ping-pongings/knowledge-base/apex_audit_summary.json
            ping-pongings/knowledge-base/apex_audit_history.jsonl
            ping-pongings/knowledge-base/benchmark_summary.json
            web/apex_audit_summary.json
            web/benchmark_summary.json
          if-no-files-found: error
          retention-days: 30
