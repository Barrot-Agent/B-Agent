name: Paid issue hunter

# Runs every 6 hours, indefinitely, until the user says stop.
#
# Read-only by governance: this repository forbids a scheduled workflow from
# holding a write permission or pushing commits (test_external_action_gates).
# So the hunt writes nothing back. It produces an artifact, and
# paid-issue-publish.yml commits that artifact on workflow_run.
#
# Disabling the schedule below is the only way to stop it.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: paid-issue-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the hunter
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/paid_issue_hunter.py

      - name: Show the result
        run: |
          head -40 PAID-ISSUES.md
          python3 - <<'PY'
          import json
          data = json.load(open("data/money/paid_issues.json"))
          priced = [r for r in data["rows"] if r["amount_usd"]]
          print("rows:", len(data["rows"]), "priced:", len(priced), "statuses:", data["status_values"])
          print("mutations performed:", data["mutations_performed"])
          assert data["mutations_performed"] == 0, "the hunter must stay read-only"
          PY

      - name: Upload the evidence
        uses: actions/upload-artifact@v4
        with:
          name: paid-issues
          path: |
            PAID-ISSUES.md
            data/money/paid_issues.json
          if-no-files-found: error
          retention-days: 7
