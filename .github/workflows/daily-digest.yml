name: Daily Digest (Artifact Only)

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build digest
        run: python3 scripts/daily_digest.py
      - uses: actions/upload-artifact@v4
        with:
          name: barrot-daily-digest
          path: digest_body.md
          if-no-files-found: error
          retention-days: 7
