name: Morpho cbXRP Market Snapshot

on:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: morpho-cbxrp-market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Read-only Morpho cbXRP/USDC snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch public market, rate, price and oracle state
        run: python scripts/ingest_morpho_cbxrp.py --output artifacts/morpho-cbxrp-snapshot.json

      - name: Upload timestamped snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morpho-cbxrp-${{ github.run_id }}
          path: artifacts/morpho-cbxrp-snapshot.json
          if-no-files-found: error
          retention-days: 90
