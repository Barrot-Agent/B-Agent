name: Dependency Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
      - "requirements.tx"
      - "pyproject.toml"
      - "hf_space/requirements.txt"
      - "legacy/requirements_legacy.txt"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit --version

      - name: Audit main runtime and development declarations
        id: main_dev
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt --strict

      - name: Audit supplemental requirements.tx declarations
        id: supplemental
        continue-on-error: true
        run: pip-audit -r requirements.tx --strict

      - name: Audit Hugging Face Space declarations
        id: hf_space
        continue-on-error: true
        run: pip-audit -r hf_space/requirements.txt --strict

      - name: Audit legacy declarations
        id: legacy
        continue-on-error: true
        run: pip-audit -r legacy/requirements_legacy.txt --strict

      - name: Fail if any manifest audit failed
        if: always()
        env:
          MAIN_DEV: ${{ steps.main_dev.outcome }}
          SUPPLEMENTAL: ${{ steps.supplemental.outcome }}
          HF_SPACE: ${{ steps.hf_space.outcome }}
          LEGACY: ${{ steps.legacy.outcome }}
        run: |
          printf 'main/dev=%s supplemental=%s hf_space=%s legacy=%s\n' "$MAIN_DEV" "$SUPPLEMENTAL" "$HF_SPACE" "$LEGACY"
          if [ "$MAIN_DEV" != "success" ] || [ "$SUPPLEMENTAL" != "success" ] || [ "$HF_SPACE" != "success" ] || [ "$LEGACY" != "success" ]; then
            exit 1
          fi
