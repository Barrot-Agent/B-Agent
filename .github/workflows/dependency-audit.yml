name: Dependency Audit

on:
  push:
    # Run on every main/integration push so dependency evidence is exact-head, not manifest-change-only.
    branches: [main, "integration/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit --version
      - name: Audit root runtime requirements
        id: root_runtime
        continue-on-error: true
        run: pip-audit -r requirements.txt --strict
      - name: Audit development requirements
        id: dev
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt --strict
      - name: Audit supplemental integrations requirements
        id: integrations
        continue-on-error: true
        run: pip-audit -r requirements-integrations.txt --strict
      - name: Audit Hugging Face Space requirements
        id: hf_space
        continue-on-error: true
        run: pip-audit -r hf_space/requirements.txt --strict
      - name: Audit legacy requirements
        id: legacy
        continue-on-error: true
        run: pip-audit -r legacy/requirements_legacy.txt --strict
      - name: Audit PEP 621 project dependencies
        id: pyproject
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          dependencies = project.get("project", {}).get("dependencies", [])
          if not dependencies:
              raise SystemExit("pyproject.toml contains no [project].dependencies to audit")
          target = Path(os.environ["RUNNER_TEMP"]) / "pyproject-requirements.txt"
          target.write_text("\n".join(dependencies) + "\n", encoding="utf-8")
          print(f"Materialized {len(dependencies)} PEP 621 dependencies for pip-audit")
          PY
          pip-audit -r "$RUNNER_TEMP/pyproject-requirements.txt" --strict

      - name: Audit PEP 621 optional dependency groups
        id: pyproject_optional_extras
        continue-on-error: true
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          extras = project.get("project", {}).get("optional-dependencies", {})
          if not isinstance(extras, dict) or not extras:
              raise SystemExit("pyproject.toml contains no [project.optional-dependencies] groups")
          output_dir = Path(os.environ["RUNNER_TEMP"]) / "pyproject-extras"
          output_dir.mkdir(parents=True, exist_ok=True)
          for name, dependencies in sorted(extras.items()):
              if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9_.-]+", name):
                  raise SystemExit(f"Invalid optional dependency group name: {name!r}")
              if not isinstance(dependencies, list) or not dependencies:
                  raise SystemExit(f"Optional dependency group {name!r} must be a non-empty list")
              if any(not isinstance(item, str) or not item.strip() for item in dependencies):
                  raise SystemExit(f"Optional dependency group {name!r} contains an invalid requirement")
              target = output_dir / f"{name}.txt"
              target.write_text("\n".join(dependencies) + "\n", encoding="utf-8")
              print(f"Materialized {len(dependencies)} dependencies from optional group {name!r}")
          PY
          shopt -s nullglob
          requirements_files=("$RUNNER_TEMP"/pyproject-extras/*.txt)
          if (("${#requirements_files[@]}" == 0)); then
            echo "No optional dependency groups were materialized" >&2
            exit 1
          fi
          for requirements_file in "${requirements_files[@]}"; do
            echo "Auditing optional extra: $(basename "$requirements_file")"
            pip-audit -r "$requirements_file" --strict
          done
      - name: Fail if any manifest audit failed
        if: always()
        env:
          ROOT_RUNTIME: ${{ steps.root_runtime.outcome }}
          DEV: ${{ steps.dev.outcome }}
          INTEGRATIONS: ${{ steps.integrations.outcome }}
          HF_SPACE: ${{ steps.hf_space.outcome }}
          LEGACY: ${{ steps.legacy.outcome }}
          PYPROJECT: ${{ steps.pyproject.outcome }}
          PYPROJECT_OPTIONAL_EXTRAS: ${{ steps.pyproject_optional_extras.outcome }}
        run: |
          printf 'root_runtime=%s dev=%s integrations=%s hf_space=%s legacy=%s pyproject=%s optional_extras=%s\n' "$ROOT_RUNTIME" "$DEV" "$INTEGRATIONS" "$HF_SPACE" "$LEGACY" "$PYPROJECT" "$PYPROJECT_OPTIONAL_EXTRAS"
          if [ "$ROOT_RUNTIME" != "success" ] || [ "$DEV" != "success" ] || [ "$INTEGRATIONS" != "success" ] || [ "$HF_SPACE" != "success" ] || [ "$LEGACY" != "success" ] || [ "$PYPROJECT" != "success" ] || [ "$PYPROJECT_OPTIONAL_EXTRAS" != "success" ]; then
            exit 1
          fi
