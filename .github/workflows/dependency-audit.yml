name: Read-only Python Dependency Audit

on:
  schedule:
    - cron: '23 4 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit production and development dependency constraints
        run: pip-audit --requirement requirements-dev.txt --format json --output dependency-audit.json

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
