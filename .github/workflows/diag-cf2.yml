name: Diagnose Cloudflare Account ID (quarantined pending explicit diagnostic authorization)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous diagnostic emitted a hard-coded account identifier and partial account-ID characters derived from a secret into workflow logs without a separate per-run authorization."
          echo "It remains disabled until diagnostic scope and log visibility are explicitly reviewed."
          echo "No Cloudflare account secret is read and no account identifier or secret fragment is emitted."
