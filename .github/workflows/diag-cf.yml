name: Diagnose Cloudflare Token (quarantined pending explicit diagnostic authorization)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous diagnostic used Cloudflare API credentials and emitted account names and token-scope metadata to workflow logs without a separate per-run authorization."
          echo "It remains disabled until diagnostic scope, log visibility and public metadata disclosure are explicitly reviewed."
          echo "No Cloudflare token is read, no API request is made, and no account metadata is emitted."
