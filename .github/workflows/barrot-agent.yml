name: Barrot Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      title:
        description: Task title
        required: true
      body:
        description: Task detail
        required: true
      mode:
        description: Explicit task route
        type: choice
        options:
          - engineering
          - scientific_discovery
        default: engineering
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: barrot-agent-worker
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      ((github.event.label.name == 'barrot-task' || github.event.label.name == 'barrot-scientific-discovery') &&
       (github.event.sender.login == 'Barrot-Agent' || github.event.sender.login == github.repository_owner))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL != '' && vars.BRAIN_MODEL || 'openai/gpt-oss-120b' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Claim next queued scientific-discovery issue
        id: scheduled_task
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(gh issue list --repo "$REPO" --state open --label barrot-scientific-discovery --json number,title,body,labels --limit 100 | jq -c '[.[] | select(all(.labels[]?.name; . != "barrot-dispatch-attempted"))] | sort_by(.number) | .[0] // empty')"
          if [[ -z "$candidate" || "$candidate" == "null" ]]; then
            echo "No unclaimed scientific-discovery issue is queued."
            echo "issue_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          issue_number="$(jq -r '.number' <<< "$candidate")"
          gh issue edit "$issue_number" --repo "$REPO" --add-label barrot-dispatch-attempted
          delimiter="BARROT_TASK_$(date +%s%N)"
          {
            echo "issue_number=$issue_number"
            echo "mode=scientific_discovery"
            echo "title<<$delimiter"
            jq -r '.title' <<< "$candidate"
            echo "$delimiter"
            echo "body<<$delimiter"
            jq -r '.body // ""' <<< "$candidate"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Mark issue-triggered task as claimed
        if: github.event_name == 'issues' && (github.event.label.name == 'barrot-task' || github.event.label.name == 'barrot-scientific-discovery')
        env:
          ISSUE_TO_CLAIM: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_TO_CLAIM" --repo "$REPO" --add-label barrot-dispatch-attempted
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run Barrot
        if: github.event_name != 'schedule' || steps.scheduled_task.outputs.issue_number != ''
        env:
          TASK_TITLE: ${{ steps.scheduled_task.outputs.title || github.event.issue.title || inputs.title }}
          TASK_MODE: ${{ steps.scheduled_task.outputs.mode || inputs.mode || (github.event.label.name == 'barrot-scientific-discovery' && 'scientific_discovery' || 'engineering') }}
          TASK_BODY: ${{ steps.scheduled_task.outputs.body || github.event.issue.body || inputs.body }}
          ISSUE_NUMBER: ${{ steps.scheduled_task.outputs.issue_number || github.event.issue.number || '0' }}
          BRANCH: barrot/task-${{ steps.scheduled_task.outputs.issue_number || github.event.issue.number || github.run_id }}
        run: python3 scripts/barrot_agent.py
      - name: Release completed issue from the queue
        if: success() && (steps.scheduled_task.outputs.issue_number || github.event.issue.number || '0') != '0'
        env:
          ISSUE_NUMBER: ${{ steps.scheduled_task.outputs.issue_number || github.event.issue.number || '0' }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label barrot-scientific-discovery --remove-label barrot-task --remove-label barrot-dispatch-attempted
