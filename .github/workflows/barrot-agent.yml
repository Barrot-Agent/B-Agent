name: Barrot Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      title:
        description: Task title
        required: true
      body:
        description: Task detail
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'barrot-task'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Groq key probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "key length: ${#GROQ_API_KEY}"
          echo "first4: ${GROQ_API_KEY:0:4}"
          curl -s -w "\nHTTP:%{http_code}\n" https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" \
            -d '{"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":"hi"}],"max_tokens":5}'

      - name: Run Barrot
        env:
          TASK_TITLE: ${{ github.event.issue.title || inputs.title }}
          TASK_BODY: ${{ github.event.issue.body || inputs.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '0' }}
          BRANCH: barrot/task-${{ github.event.issue.number || github.run_id }}
        run: python3 scripts/barrot_agent.py
