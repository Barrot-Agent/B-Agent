name: Barrot Telemetry Snapshot (Artifact Only)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Generate explicitly limited telemetry report
        run: |
          python3 - <<'PY'
          import datetime
          from pathlib import Path
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          report = f"""# BARROT TELEMETRY SNAPSHOT
          **Timestamp:** {now}
          **Status:** TELEMETRY_ONLY_NOT_OPERATIONAL_VERIFICATION
          **Mode:** artifact-only
          **Deployment verification:** NOT_PERFORMED
          **Product files:** web/, core/ and hf_space/ remain human-managed.
          This report records workflow execution only; it does not assert service health or deployment success.
          """
          Path("AUTONOMOUS_DEPLOYMENT_REPORT.md").write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Upload telemetry snapshot
        uses: actions/upload-artifact@v7
        with:
          name: barrot-telemetry-${{ github.run_id }}
          path: AUTONOMOUS_DEPLOYMENT_REPORT.md
          if-no-files-found: error
          retention-days: 30
