name: Barrot Telemetry Snapshot (read-only)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate telemetry report in runner workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path

          report = f"""# BARROT TELEMETRY SNAPSHOT
          **Timestamp:** {datetime.now(timezone.utc).isoformat()}
          **Status:** TELEMETRY_ONLY
          **Deployment:** NOT_PERFORMED
          - Mode: read-only telemetry snapshot
          - Repository state: no files committed or pushed
          - External services: no deployment or configuration change performed
          - Policy: web/, core/, and hf_space/ remain human-managed
          """
          Path("AUTONOMOUS_DEPLOYMENT_REPORT.md").write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Upload bounded telemetry artifact
        uses: actions/upload-artifact@v4
        with:
          name: barrot-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: AUTONOMOUS_DEPLOYMENT_REPORT.md
          if-no-files-found: error
          retention-days: 30

      - name: Record read-only result
        shell: bash
        run: |
          {
            echo "## Barrot telemetry snapshot"
            echo ""
            echo "Telemetry was generated in the runner workspace and uploaded as a 30-day artifact."
            echo "No repository file was committed or pushed."
            echo "No deployment or external service change was performed."
          } >> "$GITHUB_STEP_SUMMARY"
