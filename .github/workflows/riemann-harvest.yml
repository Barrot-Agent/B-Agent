
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harvest and normalize research
        run: python barrot_agent/ingestion/riemann_harvest.py
      - name: Build read-only A2A research corpus
        run: python barrot_agent/ingestion/build_riemann_a2a_corpus.py
      - name: Validate harvesting subsystem
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_riemann_harvest.py -q
      - name: Commit validated knowledge updates
        run: |
          git config user.name "barrot-omega"
          git config user.email "barrot-omega@users.noreply.github.com"
          git push
