name: Riemann Research Harvest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Harvest and normalize public research
        run: python barrot_agent/ingestion/riemann_harvest.py
      - name: Build read-only A2A research corpus
        run: python barrot_agent/ingestion/build_riemann_a2a_corpus.py
      - name: Validate harvesting subsystem
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_riemann_harvest.py -q
      - name: Preserve results as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: riemann-research-harvest-${{ github.run_number }}
          path: |
            data/research/riemann_hypothesis_harvest.json
            a2a/riemann_research_corpus.js
          if-no-files-found: error
          retention-days: 30
