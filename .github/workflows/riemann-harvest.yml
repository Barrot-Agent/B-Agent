name: Riemann Research Harvest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Harvest and normalize public research
        run: python barrot_agent/ingestion/riemann_harvest.py
      - name: Build read-only A2A research corpus
        run: python barrot_agent/ingestion/build_riemann_a2a_corpus.py
      - name: Validate harvesting subsystem
        run: |
          # The focused test overrides global coverage addopts; full CI owns the coverage gate.
          python -m pip install --quiet pytest pytest-cov pydantic-settings
          python -m pytest -o addopts= tests/test_riemann_harvest.py -q
      - name: Preserve results as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: riemann-research-harvest-${{ github.run_number }}
          path: |
            data/research/riemann_hypothesis_harvest.json
            a2a/riemann_research_corpus.js
          if-no-files-found: error
          retention-days: 30
