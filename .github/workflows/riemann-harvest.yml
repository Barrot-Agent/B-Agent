name: Riemann Research Harvest (artifact only)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Harvest and normalize research
        run: python barrot_agent/ingestion/riemann_harvest.py
      - name: Build read-only A2A research corpus
        run: python barrot_agent/ingestion/build_riemann_a2a_corpus.py
      - name: Validate harvesting subsystem
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/test_riemann_harvest.py -q
      - name: Upload validated research outputs
        uses: actions/upload-artifact@v4
        with:
          name: riemann-harvest-${{ github.run_id }}
          path: |
            data/research/riemann_hypothesis_harvest.json
            a2a/riemann_research_corpus.js
          if-no-files-found: error
          retention-days: 90
