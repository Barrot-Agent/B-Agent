name: WebMCP Monetization Enrichment

on:
  workflow_run:
    workflows: ["WebMCP Trend Digest"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  enrich:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the approved upstream trend artifact
        uses: actions/download-artifact@v7
        with:
          name: webmcp-trend-digest-${{ github.event.workflow_run.run_number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/webmcp-trend-digest
      - name: Stage trend data for enrichment
        run: |
          mkdir -p ping-pongings/knowledge-base web
          cp /tmp/webmcp-trend-digest/ping-pongings/knowledge-base/webmcp_trend_summary.json ping-pongings/knowledge-base/webmcp_trend_summary.json
          cp /tmp/webmcp-trend-digest/web/webmcp_trend_summary.json web/webmcp_trend_summary.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Enrich candidates with public monetization signals
        run: python3 scripts/webmcp_monetization_enrich.py
      - name: Preserve enrichment as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: webmcp-monetization-enrichment-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/webmcp_monetization_signals.json
            web/webmcp_monetization_signals.json
          if-no-files-found: warn
          retention-days: 30
