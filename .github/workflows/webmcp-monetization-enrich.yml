name: WebMCP Monetization Enrichment (artifact only)

on:
  workflow_run:
    workflows: ["WebMCP Trend Digest"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Enrich candidates with monetization signals
        run: python3 scripts/webmcp_monetization_enrich.py
      - name: Upload enriched research
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-monetization-enrichment-${{ github.run_id }}
          path: |
            ping-pongings/knowledge-base/webmcp_monetization_signals.json
            web/webmcp_monetization_signals.json
          if-no-files-found: error
          retention-days: 30
