name: Kaggle Competitions Automation

on:
  workflow_dispatch:
    inputs:
      confirm_external_submission:
        description: "Explicitly authorize submissions to the exact competition slugs listed below"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      expected_source_sha:
        description: "Expected exact main commit approved for this external action"
        required: true
        type: string
      competition_allowlist:
        description: "Comma-separated exact Kaggle competition slugs approved for this run"
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  kaggle-auto:
    if: ${{ inputs.confirm_external_submission == 'YES' && inputs.competition_allowlist != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Verify exact approved main commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected source SHA must be a full commit hash." >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Checked-out main commit does not match the approved source SHA." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas scikit-learn

      - name: Submit only to explicitly allowlisted competitions
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_MAX_COMPETITIONS: '5'
          KAGGLE_SUBMISSION_ALLOWLIST: ${{ inputs.competition_allowlist }}
        run: python scripts/kaggle_competitions_automation.py
