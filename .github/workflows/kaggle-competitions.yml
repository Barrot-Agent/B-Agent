name: Kaggle Competitions Automation

on:
  schedule:
    - cron: '0 0 * * *'   # daily at 00:00 UTC
  workflow_dispatch:
    inputs:
      allow_submissions:
        description: "Actually submit generated baseline predictions to Kaggle (external action)"
        required: true
        default: false
        type: boolean

jobs:
  kaggle-auto:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas scikit-learn

      - name: Run Kaggle automation
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_ALLOW_SUBMISSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_submissions == true }}
          KAGGLE_MAX_COMPETITIONS: '1'
        run: python scripts/kaggle_competitions_automation.py
