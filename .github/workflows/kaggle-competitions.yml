name: Kaggle Competitions Automation

on:
  workflow_dispatch:
    inputs:
      allow_submission:
        description: "Explicitly authorize submissions to selected Kaggle competitions"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: kaggle-competitions-manual
  cancel-in-progress: false

jobs:
  kaggle-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas scikit-learn

      - name: Run Kaggle automation
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_MAX_COMPETITIONS: "5"
          KAGGLE_ALLOW_SUBMISSIONS: ${{ inputs.allow_submission }}
        run: python scripts/kaggle_competitions_automation.py
