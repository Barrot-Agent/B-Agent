name: Kaggle Competitions Automation (manual opt-in only)

on:
  workflow_dispatch:
    inputs:
      allow_submission:
        description: "Set true only after reviewing the exact competition slugs below"
        required: true
        type: boolean
        default: false
      competition_allowlist:
        description: "Comma-separated exact Kaggle competition slugs approved for this run; no wildcard"
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  kaggle-auto:
    if: ${{ inputs.allow_submission == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas scikit-learn

      - name: Run explicitly authorized Kaggle automation
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_MAX_COMPETITIONS: "5"
          KAGGLE_ALLOW_SUBMISSIONS: ${{ inputs.allow_submission }}
          KAGGLE_COMPETITION_ALLOWLIST: ${{ inputs.competition_allowlist }}
        run: python scripts/kaggle_competitions_automation.py
