name: Kaggle Competitions Automation

on:
  workflow_dispatch:
    inputs:
      confirm_external_submission:
        description: "Explicitly authorize submissions to the exact competition slugs listed below"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO
      competition_allowlist:
        description: "Comma-separated exact Kaggle competition slugs approved for this run"
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  kaggle-auto:
    if: ${{ inputs.confirm_external_submission == 'YES' && inputs.competition_allowlist != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kaggle pandas scikit-learn

      - name: Submit only to explicitly allowlisted competitions
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_MAX_COMPETITIONS: '5'
          KAGGLE_SUBMISSION_ALLOWLIST: ${{ inputs.competition_allowlist }}
        run: python scripts/kaggle_competitions_automation.py
