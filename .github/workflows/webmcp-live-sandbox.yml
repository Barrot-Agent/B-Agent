name: WebMCP Live Sandbox

on:
  workflow_dispatch:
    inputs:
      confirm_live_execution:
        description: "Explicitly authorize invoking every registered WebMCP tool in the sandbox"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

      expected_source_sha:
        description: "Expected exact main commit approved for this external action"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sandbox:
    if: ${{ inputs.confirm_live_execution == 'YES' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact approved main commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected source SHA must be a full commit hash." >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Checked-out main commit does not match the approved source SHA." >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python3 -m playwright install --with-deps chromium
      - name: Run live WebMCP sandbox
        run: python3 scripts/webmcp_live_sandbox.py
      - name: Preserve sandbox log as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webmcp-live-sandbox-${{ github.run_number }}
          path: ping-pongings/knowledge-base/webmcp_sandbox_log.jsonl
          if-no-files-found: warn
          retention-days: 14
