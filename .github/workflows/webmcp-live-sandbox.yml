name: WebMCP Live Sandbox (quarantined pending per-tool authorization)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous sandbox invoked every registered WebMCP tool rather than a reviewed per-tool allowlist."
          echo "A blanket approval is insufficient where a registered tool may perform an external action."
          echo "It remains disabled until each tool's capability, permission, side effect and exact invocation are individually allowlisted."
          echo "No browser is launched, no tool is invoked, and no external or repository mutation occurs."
