name: WebMCP Live Sandbox (artifact only)

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install playwright
      - run: python3 -m playwright install --with-deps chromium
      - name: Run live WebMCP sandbox
        run: python3 scripts/webmcp_live_sandbox.py
      - name: Upload sandbox log
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-live-sandbox-${{ github.run_id }}
          path: ping-pongings/knowledge-base/webmcp_sandbox_log.jsonl
          if-no-files-found: error
          retention-days: 30
