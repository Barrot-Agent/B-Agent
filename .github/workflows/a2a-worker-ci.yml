name: A2A Worker Tests

on:
  push:
    branches: [main]
    paths:
      - "a2a/**"
      - ".github/workflows/a2a-worker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "a2a/**"
      - ".github/workflows/a2a-worker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test Cloudflare Worker and durable queue
        working-directory: a2a
        run: node --test worker.test.js
      - name: Validate Wrangler configuration and bundle without deploying
        working-directory: a2a
        run: npx --yes wrangler@4 deploy --dry-run
