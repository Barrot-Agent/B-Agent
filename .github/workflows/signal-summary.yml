name: Generate Signal Summary
on:
  workflow_dispatch:
  # Fire immediately after the Knowledge Signal Cycle finishes writing latest_signal.json
  workflow_run:
    workflows: ["Knowledge Signal Cycle"]
    types: [completed]
    branches: [main]
  # Fallback cron: runs at :25 (after knowledge-signal-cycle at :18)
  schedule:
    - cron: '25 * * * *'
jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate summary + TTS
        run: python3 scripts/signal_summary.py
      - name: Commit
        run: |
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add web/latest_signal_summary.json
          git add web/generated_audio/ || true
          git diff --cached --quiet || git commit -m "Signal summary [skip ci]"
          git push || (git pull --no-rebase --no-edit origin main && git push)
