name: Generate Signal Summary
on:
  workflow_dispatch:
  # Fire immediately after the Knowledge Signal Cycle finishes writing latest_signal.json
  workflow_run:
    workflows: ["Knowledge Signal Cycle"]
    types: [completed]
    branches: [main]
  # Fallback cron: runs at :25 (after knowledge-signal-cycle at :18)
  schedule:
    - cron: '25 * * * *'
permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate summary + TTS
        run: python3 scripts/signal_summary.py
      - name: Upload summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-summary-${{ github.run_id }}
          path: |
            web/latest_signal_summary.json
            web/generated_audio/
          if-no-files-found: warn
          retention-days: 30
