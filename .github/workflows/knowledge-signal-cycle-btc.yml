name: Knowledge Signal Cycle BTC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install requests vaderSentiment
      - name: Ingest fresh BTC news
        run: python3 scripts/knowledge_ingest_btc.py
      - name: Distill new BTC entries
        run: python3 scripts/knowledge_distill_btc.py
      - name: Emit blended BTC signal
        run: python3 scripts/emit_signal_btc.py
      - name: Upload knowledge-signal-cycle-btc artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-signal-cycle-btc-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/log_btc.jsonl
            ping-pongings/knowledge-base/config_btc.json
            web/latest_signal_btc.json
            web/signal_history_btc.jsonl
          if-no-files-found: warn
          retention-days: 7
