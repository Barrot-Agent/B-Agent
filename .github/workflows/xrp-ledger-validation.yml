name: XRP Ledger Archive Validation

on:
  push:
    branches:
      - research/xrp-ledger-shard-migration-20261029T2210Z
  pull_request:
    branches:
      - research/xrp-ledger-index-pointer-migration-20261028T1959Z

permissions:
  contents: read

concurrency:
  group: xrp-ledger-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ledger:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'research/xrp-ledger-shard-migration-20261029T2210Z'
    name: Validate sharded XRP ledger and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Compile validator and tests
        run: python -m compileall -q scripts/validate_xrp_ledger_index.py tests/test_xrp_ledger_index.py tests/test_xrp_exchange_balance_snapshot.py tests/test_sbic_identity.py
      - name: Validate actual repository ledger and archive pointers
        run: python scripts/validate_xrp_ledger_index.py --root .
      - name: Run isolated ledger validator regression suite
        run: python -m pytest --noconftest -o addopts= tests/test_xrp_ledger_index.py tests/test_xrp_exchange_balance_snapshot.py tests/test_sbic_identity.py -q
