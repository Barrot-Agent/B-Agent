name: XRP Ledger Archive Validation

on:
  push:
    branches:
      - research/xrp-ledger-shard-migration-20261029T2210Z

permissions:
  contents: read

concurrency:
  group: xrp-ledger-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ledger:
    name: Validate sharded XRP ledger and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Compile validator and tests
        run: python -m compileall -q scripts/validate_xrp_ledger_index.py tests/test_xrp_ledger_index.py
      - name: Run isolated ledger validator regression suite
        run: python -m pytest --noconftest -o addopts= tests/test_xrp_ledger_index.py -q
