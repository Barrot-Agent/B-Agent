name: Barrot Superior Merge (manual) (disabled pending protected approval)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        shell: bash
        run: |
          set -euo pipefail
          echo "Disabled: model merge/upload previously used HF credentials and trust_remote_code. Re-enable only after protected Environment review, artifact provenance, target allowlist and explicit approval."
          echo "No credentials are read and no external or repository mutation is performed."
