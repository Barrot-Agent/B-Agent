name: Barrot Superior Merge (duplicate disabled)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain fail-closed status
        shell: bash
        run: |
          set -euo pipefail
          echo "This duplicate model-upload workflow is disabled."
          echo "The primary model-upload workflow is also quarantined because its reviewed MergeKit configuration is absent."
          echo "No credentials are read and no external action is performed."
