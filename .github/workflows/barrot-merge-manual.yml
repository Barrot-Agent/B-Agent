name: Barrot Superior Merge (duplicate disabled)

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain fail-closed status
        shell: bash
        run: |
          set -euo pipefail
          echo "This duplicate model-upload workflow is disabled. Use barrot-merge.yml only with explicit per-run confirmation."
          echo "No credentials are read and no external action is performed."
