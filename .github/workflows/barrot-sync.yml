name: Barrot Sync (disabled pending PR-only replacement)

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        shell: bash
        run: |
          set -euo pipefail
          echo "Disabled: the legacy workflow attempted to run an unsupported --sync CLI flag and could push generated content directly to main. Replace only with a reviewed PR-only flow."
          echo "No credentials are read and no external or repository mutation is performed."
