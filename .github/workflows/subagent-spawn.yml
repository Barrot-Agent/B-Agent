name: Sub-Agent Spawn (thread pool tier)

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Complex task to decompose and spawn subagents for"
        required: true
        default: "Analyze the last 30 days of signal accuracy and recommend threshold changes"

permissions:
  contents: read

jobs:
  spawn:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SPAWN_TASK: ${{ github.event.inputs.task }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 scripts/subagent_spawner.py
      - name: Upload subagent-spawn artifact
        uses: actions/upload-artifact@v4
        with:
          name: subagent-spawn-${{ github.run_number }}
          path: |
            subagent_run_*.json
          if-no-files-found: warn
          retention-days: 7
