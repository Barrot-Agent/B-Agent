name: Sub-Agent Spawn (quarantined pending integration-first authorization)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous workflow sent free-form task prompts to Groq and committed generated sub-agent records directly to main."
          echo "It is disabled until a branch-only, artifact-first task flow enforces explicit data-sharing approval and open-PR deduplication."
          echo "No provider credentials are read and no repository or external mutation occurs."
