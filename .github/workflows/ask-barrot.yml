name: Ask Barrot

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ask:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Ask Barrot
        run: python3 scripts/ask_barrot.py
      - name: Post as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "Barrot self-assessment" --body-file barrot_answer.md
