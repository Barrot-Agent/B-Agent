name: Ask Barrot (quarantined pending branch-only integration)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The previous Ask Barrot workflow loaded Groq credentials, accepted free-form prompts, and could commit generated artifacts directly to main with contents/issues write permission."
          echo "The workflow remains disabled until a branch-only, artifact-first, explicit per-run approval flow with exact-main-SHA validation is implemented and tested."
          echo "No credentials are loaded, no external service is called, and no repository mutation occurs."
