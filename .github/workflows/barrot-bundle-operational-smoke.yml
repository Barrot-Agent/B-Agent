name: Barrot Bundle Operational Smoke

on:
  push:
    branches:
      - feat/bundle-task-dispatch-resume-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-lifecycle-smoke:
    name: Durable queue and restart recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyJWT cryptography pydantic pydantic-settings requests

      - name: Verify durable queue and bundle lifecycle integration
        run: |
          python -m pytest -q \
            tests/test_bundle_lifecycle.py::test_dispatcher_handles_no_change_from_real_work_queue_controller \
            tests/test_bundle_lifecycle.py::test_dispatcher_recovers_real_queue_completion_after_lifecycle_interruption \
            tests/test_bundle_lifecycle.py::test_dispatcher_resumes_after_interruption_between_tasks \
            tests/test_repository_repair.py::test_work_queue_resumes_after_interruption
