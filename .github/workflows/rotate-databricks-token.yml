name: Rotate Databricks Token (disabled)

on:
  workflow_dispatch:

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain fail-closed status
        shell: bash
        run: |
          set -euo pipefail
          echo "PAT values must never be supplied as workflow_dispatch inputs. Rotate secrets through the approved secret-management interface."
          echo "No credentials are read and no external action is performed."
