name: Capability Discovery (manual artifact only)

on:
  workflow_dispatch:
    inputs:
      gap_name:
        description: "Capability gap; this text is sent to Groq. Use public or authorized information only."
        required: true
        default: "System degradation prediction"
      confirm:
        description: "Type YES only after confirming the inputs are public/authorized for Groq processing."
        required: true
        default: "NO"
      expected_main_sha:
        description: "Exact 40-character main SHA to analyze."
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: capability-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'YES' && inputs.expected_main_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GAP_NAME: ${{ inputs.gap_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Verify exact main SHA
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::External-model workflows must be dispatched from main"; exit 1; }
          if [[ ! "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected main SHA must be exactly 40 lowercase hexadecimal characters."
            exit 1
          fi
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          checked_out="$(git rev-parse HEAD)"
          if [[ "$current_main" != "$EXPECTED_MAIN_SHA" || "$checked_out" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::Main or checkout no longer matches the approved SHA."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Discover candidate capabilities
        run: python3 scripts/capability_discovery.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Mark output as unverified suggestions
        run: |
          echo "Groq-generated capability candidates are suggestions, not source evidence, verified integrations, or model features." >> "$GITHUB_STEP_SUMMARY"
          echo "No repository files were committed or pushed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: capability-discovery-unverified-${{ github.run_id }}
          path: |
            capability_discovery_*.json
            ping-pongings/knowledge-base/capability_usage_docs.jsonl
          if-no-files-found: error
          retention-days: 7
