name: Data Value Triage (manual artifact only)

on:
  workflow_dispatch:
    inputs:
      triage_input:
        description: "JSON array of {id,text}; sent to Groq. Use public or authorized information only."
        required: true
        default: "[]"
      active_goals:
        description: "Comma-separated active goals; sent to Groq."
        required: false
        default: "XRP signals,capability gaps"
      confirm:
        description: "Type YES only after confirming all supplied text is public/authorized for Groq processing."
        required: true
        default: "NO"
      expected_main_sha:
        description: "Exact 40-character main SHA to analyze."
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: data-value-triage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'YES' && inputs.expected_main_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TRIAGE_INPUT: ${{ inputs.triage_input }}
      ACTIVE_GOALS: ${{ inputs.active_goals }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Verify exact main SHA
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::External-model workflows must be dispatched from main"; exit 1; }
          if [[ ! "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected main SHA must be exactly 40 lowercase hexadecimal characters."
            exit 1
          fi
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          checked_out="$(git rev-parse HEAD)"
          if [[ "$current_main" != "$EXPECTED_MAIN_SHA" || "$checked_out" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::Main or checkout no longer matches the approved SHA."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Score triage candidates
        run: python3 scripts/data_value_triage.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Mark output as unverified triage
        run: |
          echo "Groq-generated novelty/relevance/density scores are triage suggestions only. They are not source verification, feature values, or forecasts." >> "$GITHUB_STEP_SUMMARY"
          echo "No repository files were committed or pushed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: data-value-triage-unverified-${{ github.run_id }}
          path: |
            triage_results_*.json
            ping-pongings/knowledge-base/seen_content_hashes.json
          if-no-files-found: error
          retention-days: 7
