name: Data Value Triage

on:
  workflow_dispatch:
    inputs:
      triage_input:
        description: "JSON array of {id, text} items"
        required: true
        default: '[]'
      active_goals:
        description: "Comma-separated active goals"
        required: false
        default: "XRP signals,capability gaps"

jobs:
  triage:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TRIAGE_INPUT: ${{ github.event.inputs.triage_input }}
      ACTIVE_GOALS: ${{ github.event.inputs.active_goals }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 scripts/data_value_triage.py
      - name: Commit
        run: |
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add triage_results_*.json ping-pongings/knowledge-base/seen_content_hashes.json
          git diff --cached --quiet || git commit -m "Data value triage run [skip ci]"
          push_with_retry() {
            local max_attempts=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              if git push; then
                echo "Pushed on attempt $attempt"
                return 0
              fi
              echo "Push attempt $attempt failed, pulling and retrying..."
              sleep $(( (RANDOM % 5) + attempt ))
              git pull --no-rebase --no-edit origin main
              attempt=$(( attempt + 1 ))
            done
            echo "FAILED to push after $max_attempts attempts -- data committed locally but not on main"
            return 1
          }
          push_with_retry
