name: Restart Barrot Space (explicit approval required)

on:
  workflow_dispatch:
    inputs:
      confirm_external_change:
        description: "Set to YES only after explicit approval for this factory restart"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

      expected_source_sha:
        description: "Expected exact main commit approved for this external action"
        required: true
        type: string

permissions:
  contents: read

jobs:
  restart:
    if: ${{ inputs.confirm_external_change == 'YES' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout approved main commit
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact approved main commit
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Expected source SHA must be a full commit hash." >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "Checked-out main commit does not match the approved source SHA." >&2
            exit 1
          fi

      - name: Factory-restart the Space after approval
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          curl --fail --show-error --silent -X POST \
            "https://huggingface.co/api/spaces/Scribedpengenius/Barrot-Omega/restart?factory=true" \
            -H "Authorization: Bearer $HF_TOKEN"
