name: Restart Barrot Space

on:
  workflow_dispatch:
    inputs:
      confirm_external_change:
        description: "Set to YES only after explicit approval for this specific external Space restart."
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions: {}

jobs:
  restart:
    if: ${{ inputs.confirm_external_change == 'YES' && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: Factory-restart the Space via stored HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          echo "=== restarting Barrot-Omega ==="
          curl --fail-with-body -sS -X POST "https://huggingface.co/api/spaces/Scribedpengenius/Barrot-Omega/restart?factory=true" \
            -H "Authorization: Bearer $HF_TOKEN" \
            -w "\nHTTP:%{http_code}\n"
