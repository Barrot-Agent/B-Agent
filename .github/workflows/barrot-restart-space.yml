name: Restart Barrot Space

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Factory-restart the Space via stored HF_TOKEN
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=== restarting Barrot-Omega ==="
          curl -s -X POST "https://huggingface.co/api/spaces/Scribedpengenius/Barrot-Omega/restart?factory=true" \
            -H "Authorization: Bearer $HF_TOKEN" \
            -w "\nHTTP:%{http_code}\n"
