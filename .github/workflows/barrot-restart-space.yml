name: Restart Barrot Space (disabled pending protected approval)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        shell: bash
        run: |
          set -euo pipefail
          echo "Disabled: factory restart is an external mutation. Re-enable only through a protected Environment with a required reviewer and explicit approval."
          echo "No credentials are read and no external or repository mutation is performed."
