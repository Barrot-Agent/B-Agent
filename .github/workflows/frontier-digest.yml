name: Frontier Digest

on:
  workflow_dispatch:
    inputs:
      confirm_external_research:
        description: "Explicitly authorize public arXiv retrieval and Groq-backed frontier analysis"
        required: true
        type: choice
        options:
          - NO
          - YES
        default: NO

permissions:
  contents: read

jobs:
  digest:
    if: ${{ inputs.confirm_external_research == 'YES' }}
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Ingest arxiv and benchmark coverage
        run: python3 scripts/frontier_ingest.py
      - name: Distill new entries
        run: python3 scripts/frontier_distill.py
      - name: Run gap analysis
        run: python3 scripts/frontier_gap_analysis.py
      - name: Preserve frontier findings as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: barrot-frontier-digest-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/frontier_log.jsonl
            ping-pongings/knowledge-base/upgrade_recommendations.jsonl
          if-no-files-found: warn
          retention-days: 90
