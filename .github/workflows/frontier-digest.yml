name: Frontier Digest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Ingest arxiv + benchmark coverage
        run: python3 scripts/frontier_ingest.py
      - name: Distill new entries
        run: python3 scripts/frontier_distill.py
      - name: Run gap analysis (frontier findings vs current stack)
        run: python3 scripts/frontier_gap_analysis.py
      - name: Upload frontier-digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontier-digest-${{ github.run_number }}
          path: |
            ping-pongings/knowledge-base/frontier_log.jsonl
            ping-pongings/knowledge-base/upgrade_recommendations.jsonl
          if-no-files-found: warn
          retention-days: 7
