name: Check Signal Accuracy (disabled pending fixed-horizon evaluator)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    name: Explain disabled legacy evaluator
    runs-on: ubuntu-latest
    steps:
      - name: Explain why evaluation is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo "Legacy accuracy evaluation is disabled pending a fixed-horizon, point-in-time evaluator."
          echo "No historical signal records will be rewritten."
          echo "No repository files will be committed or pushed."
          echo "Do not interpret the legacy variable-horizon score as calibrated forecast skill."
