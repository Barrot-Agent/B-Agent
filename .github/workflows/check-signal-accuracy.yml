name: Check Signal Accuracy (disabled pending validated fixed-horizon evaluation)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "The previous scorer compared a signal with one mutable live price after a minimum delay, then wrote a binary result and pushed it to main."
          echo "It is disabled until point-in-time reference prices, source timestamps, exact target horizons and reproducible outcome scoring are merged and verified."
          echo "Historical accuracy claims remain unvalidated; no new score is published."
