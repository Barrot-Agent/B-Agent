name: Check Signal Accuracy

on:
  schedule:
    - cron: '55 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Emit honest evaluation status
        run: python3 scripts/check_signal_accuracy.py
      - name: Upload evaluation status
        uses: actions/upload-artifact@v4
        with:
          name: signal-accuracy-${{ github.run_id }}
          path: web/signal_accuracy.json
          if-no-files-found: error
          retention-days: 30
