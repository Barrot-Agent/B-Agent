name: Check Signal Accuracy (artifact-only; no main writes)

on:
  schedule:
    - cron: '55 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install requests
      - name: Generate legacy signal outcome diagnostics
        run: python3 scripts/check_signal_accuracy.py
      - name: Upload timestamped outcome snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barrot-signal-accuracy-${{ github.run_id }}
          path: |
            web/signal_history.jsonl
            web/signal_accuracy.json
          if-no-files-found: warn
          retention-days: 90
