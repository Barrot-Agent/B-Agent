name: Check Signal Evaluation Status

on:
  schedule:
    - cron: '55 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Emit honest evaluation status
        run: python3 scripts/check_signal_accuracy.py

      - name: Upload evaluation status
        uses: actions/upload-artifact@v4
        with:
          name: signal-evaluation-status-${{ github.run_id }}
          path: web/signal_accuracy.json
          if-no-files-found: error
          retention-days: 30
