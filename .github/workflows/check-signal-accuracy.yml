name: Check Signal Accuracy

on:
  schedule:
    - cron: '55 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Check signal accuracy
        run: python3 scripts/check_signal_accuracy.py
      - name: Upload signal-accuracy artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-accuracy-${{ github.run_number }}
          path: |
            web/signal_history.jsonl
            web/signal_accuracy.json
          if-no-files-found: warn
          retention-days: 7
