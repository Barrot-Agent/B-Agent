name: Check Signal Evaluation Status

on:
  schedule:
    - cron: '55 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Emit fail-closed evaluation status
        run: python3 scripts/check_signal_accuracy.py > signal_evaluation_status.json

      - name: Upload evaluation status
        uses: actions/upload-artifact@v4
        with:
          name: signal-evaluation-status-${{ github.run_id }}
          path: signal_evaluation_status.json
          if-no-files-found: error
          retention-days: 30
