name: Check Signal Accuracy (manual artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Evaluate available history
        run: python3 scripts/check_signal_accuracy.py
      - name: Preserve evaluation outputs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-accuracy-${{ github.run_id }}
          path: |
            web/signal_history.jsonl
            web/signal_accuracy.json
          if-no-files-found: warn
          retention-days: 30
