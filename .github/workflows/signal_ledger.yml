name: Barrot Signal Ledger (quarantined pending validated XRP forecast engine)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "The legacy signal emitter produces model-scored sentiment output, not a calibrated fixed-horizon XRP forecast."
          echo "It can overwrite web/latest_signal.json and append a price-at-emission history without immutable outcome labels or leakage-safe evaluation."
          echo "It remains disabled until it is replaced by the verified forecast ledger and publication-readiness gate."
          echo "No model provider is called, no signal is emitted, and no repository or external mutation occurs."
