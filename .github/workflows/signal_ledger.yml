name: Barrot Signal Ledger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: pip install numpy requests
      - name: Emit signal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/emit_signal.py
      - name: Upload ledger snapshot
        uses: actions/upload-artifact@v4
        with:
          name: signal-ledger-snapshot
          path: |
            data/signal_ledger.jsonl
            web/latest_signal.json
