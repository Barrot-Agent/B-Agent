name: Merge Queue (disabled pending approval)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  disabled:
    name: Fail-closed notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled merge queue
        shell: bash
        run: |
          set -euo pipefail
          echo "Merge queue disabled pending independently verified approval gates."
          echo "No branches will be updated and no pull requests will be merged."
