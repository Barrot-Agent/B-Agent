name: Merge Queue (fail-closed pending explicit authorization)

on:
  workflow_dispatch:
    inputs:
      audit_reason:
        description: "Reason for running the audit-only queue check"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit-only:
    name: Report queue state without changing repository
    runs-on: ubuntu-latest
    steps:
      - name: State fail-closed policy
        shell: bash
        env:
          AUDIT_REASON: ${{ inputs.audit_reason }}
        run: |
          set -euo pipefail
          if [[ -z "$AUDIT_REASON" ]]; then
            echo "An audit reason is required." >&2
            exit 1
          fi
          echo "Merge queue is disabled pending explicit authorization and independent controls review."
          echo "No pull request was modified."
          echo "Audit reason: $AUDIT_REASON"
