name: Merge Queue Audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit:
    name: Read-only pull request inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: List open pull requests without mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
            --jq '.[] | [.number, (.draft|tostring), .title, .head.ref, .base.ref] | @tsv' \
            > artifacts/open-pull-requests.tsv
          echo "Open pull requests listed: $(wc -l < artifacts/open-pull-requests.tsv)"
          cat artifacts/open-pull-requests.tsv

      - name: Upload read-only inventory
        uses: actions/upload-artifact@v4
        with:
          name: pull-request-audit-${{ github.run_id }}
          path: artifacts/open-pull-requests.tsv
          if-no-files-found: error
          retention-days: 30
