name: Merge Queue (disabled pending approval)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  disabled:
    name: Fail-closed notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled merge queue
        shell: bash
        run: |
          set -euo pipefail
          echo "Merge queue is disabled pending explicit approval and independently verified merge gates."
          echo "This workflow performs no branch updates, comments, approvals, label changes, or merges."
          echo "No repository content is changed by this workflow."
