name: Merge Queue (disabled pending verified gates)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Audit note only; this workflow does not modify the repository."
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit-only:
    name: Fail-closed notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled merge queue
        shell: bash
        run: |
          set -euo pipefail
          echo "The merge queue is disabled pending independent verification of branch protection and required checks."
          echo "This workflow performs no branch updates, approvals, comments, pushes, or merges."
          echo "Use reviewed pull requests and ordinary repository-required checks."
          echo "No repository content was changed."
