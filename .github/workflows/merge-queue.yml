name: Merge Queue Audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit:
    name: Read-only pull request inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: List open pull requests without mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Read-only audit: no branch updates, comments, labels, merges, or deletions are performed.'
          gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --jq '.[] | [.number, .title, .head.ref, .base.ref, (.draft|tostring), (.mergeable_state // "unknown")] | @tsv'
