name: Merge Queue (disabled pending verified gates)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional audit note; no repository action will be performed"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit-only:
    name: Fail-closed notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled merge queue
        shell: bash
        run: |
          set -euo pipefail
          echo "The merge queue is disabled pending independent verification of branch protection and approval gates."
          echo "This workflow performs no branch updates, approvals, comments, pushes, or merges."
          echo "Use reviewed pull requests and ordinary repository-required checks."
          echo "No repository content was changed."
