name: Merge Queue Audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit:
    name: Read-only pull request audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Report open pull requests without mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "READ-ONLY AUDIT: this workflow does not update branches, comment, merge, or delete."
          gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --paginate \
            --jq '.[] | [.number, .draft, .state, .head.ref, .head.sha, .base.ref, .title] | @tsv'
