name: Merge Queue

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          Processing mode. 'label' only considers PRs carrying the specified label.
          'all' considers every open PR and should be used cautiously.
        required: true
        default: label
        type: choice
        options:
          - label
          - all
      label:
        description: "Label to filter PRs when mode=label"
        required: true
        default: merge-queue
        type: string
      max_prs:
        description: "Maximum PRs to process. Live merges must be bounded; 0 is forbidden for live merges."
        required: true
        default: "1"
        type: string
      dry_run:
        description: "Dry run — report what would happen without making changes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirm_live_merge:
        description: "Explicit second confirmation required for any live merge"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      merge_method:
        description: "Merge method"
        required: true
        default: squash
        type: choice
        options:
          - squash
          - merge
          - rebase

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  merge-queue:
    name: Process bounded merge queue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate safety controls
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          MAX_PRS: ${{ inputs.max_prs }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_LIVE_MERGE: ${{ inputs.confirm_live_merge }}
        run: |
          set -euo pipefail
          [[ "${MAX_PRS}" =~ ^[0-9]+$ ]] || { echo "ERROR: max_prs must be a non-negative integer."; exit 2; }
          if [[ "${DRY_RUN}" == "false" ]]; then
            [[ "${CONFIRM_LIVE_MERGE}" == "yes" ]] || { echo "ERROR: live merge requires confirm_live_merge=yes."; exit 2; }
            (( MAX_PRS > 0 )) || { echo "ERROR: live merge requires max_prs greater than zero."; exit 2; }
          fi
          if [[ "${MODE}" == "all" && "${DRY_RUN}" == "false" && "${MAX_PRS}" -gt 10 ]]; then
            echo "ERROR: live mode=all is capped at 10 PRs per run."
            exit 2
          fi
          echo "Safety input validation passed."

      - name: Process PRs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          LABEL: ${{ inputs.label }}
          MAX_PRS: ${{ inputs.max_prs }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM_LIVE_MERGE: ${{ inputs.confirm_live_merge }}
          MERGE_METHOD: ${{ inputs.merge_method }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "${MAX_PRS}" =~ ^[0-9]+$ ]] || { echo "ERROR: max_prs must be a non-negative integer."; exit 2; }
          if [[ "${DRY_RUN}" == "false" ]]; then
            [[ "${CONFIRM_LIVE_MERGE}" == "yes" ]] || { echo "ERROR: live merge requires confirm_live_merge=yes."; exit 2; }
            (( MAX_PRS > 0 )) || { echo "ERROR: live merge requires max_prs greater than zero."; exit 2; }
          fi

          if [[ "${MODE}" == "all" ]]; then
            RAW_PRS="$(gh api "repos/${REPO}/pulls?state=open&per_page=100" --paginate --jq '.[].number')"
          else
            [[ -n "${LABEL}" ]] || { echo "ERROR: label must not be empty when mode=label."; exit 2; }
            RAW_PRS="$(gh api "repos/${REPO}/issues?state=open&labels=$(jq -rn --arg l "${LABEL}" '$l|@uri')&per_page=100" --paginate --jq '.[] | select(.pull_request != null) | .number')"
          fi

          if [[ -z "${RAW_PRS}" ]]; then
            echo "No matching open pull requests found."
            exit 0
          fi

          mapfile -t PR_LIST <<< "${RAW_PRS}"
          if (( MAX_PRS > 0 && ${#PR_LIST[@]} > MAX_PRS )); then
            PR_LIST=("${PR_LIST[@]:0:MAX_PRS}")
          fi

          MERGED=0
          SKIPPED=0
          for PR in "${PR_LIST[@]}"; do
            INFO="$(gh pr view "${PR}" --repo "${REPO}" --json title,isDraft,mergeable,mergeStateStatus,state,headRefOid,baseRefName)"
            TITLE="$(jq -r '.title // ""' <<< "${INFO}")"
            STATE="$(jq -r '.state // ""' <<< "${INFO}")"
            DRAFT="$(jq -r '.isDraft // true' <<< "${INFO}")"
            MERGEABLE="$(jq -r '.mergeable // "UNKNOWN"' <<< "${INFO}")"
            MERGE_STATE="$(jq -r '.mergeStateStatus // "UNKNOWN"' <<< "${INFO}")"
            HEAD_SHA="$(jq -r '.headRefOid // ""' <<< "${INFO}")"

            printf 'PR #%s | %s | state=%s draft=%s mergeable=%s mergeState=%s head=%s\n' "${PR}" "${TITLE}" "${STATE}" "${DRAFT}" "${MERGEABLE}" "${MERGE_STATE}" "${HEAD_SHA}"

            if [[ "${STATE}" != "OPEN" || "${DRAFT}" == "true" || "${MERGEABLE}" != "MERGEABLE" || "${MERGE_STATE}" != "CLEAN" ]]; then
              echo "Skipping PR ${PR}: it is not a non-draft, clean, mergeable candidate."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "[dry-run] Would merge PR ${PR} using --${MERGE_METHOD}."
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            # Live merge is possible only after the explicit second confirmation
            # and bounded max_prs validation above.
            gh pr merge "${PR}" --repo "${REPO}" --"${MERGE_METHOD}"
            MERGED=$((MERGED + 1))
          done

          printf 'Run complete: merged=%s skipped=%s\n' "${MERGED}" "${SKIPPED}"
          if [[ "${DRY_RUN}" == "false" && "${MERGED}" -eq 0 && "${SKIPPED}" -gt 0 ]]; then
            echo "No PR was merged; inspect skip reasons above."
          fi
