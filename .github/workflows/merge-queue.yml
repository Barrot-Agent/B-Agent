name: Merge Queue (disabled pending explicit approval)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  disabled:
    name: Fail-closed notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled merge queue
        shell: bash
        run: |
          set -euo pipefail
          echo "Merge queue is disabled pending explicit approval and independently verified merge gates."
          echo "This workflow does not update PR branches, apply labels, approve, or merge pull requests."
          echo "No repository content was changed by this workflow."
