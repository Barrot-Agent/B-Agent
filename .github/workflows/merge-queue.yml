name: Merge Queue Audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit:
    name: Read-only pull request inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: List open pull requests without mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --jq '[.[] | {
            number,
            title,
            draft,
            state,
            head_ref: .head.ref,
            head_sha: .head.sha,
            base_ref: .base.ref,
            base_sha: .base.sha,
            updated_at
          }]' "repos/$REPO/pulls?state=open&per_page=100" |
            jq -s 'add' > "$RUNNER_TEMP/open-pull-requests.json"

          count="$(jq 'length' "$RUNNER_TEMP/open-pull-requests.json")"
          echo "Open pull requests inspected: $count"
          jq -r '.[] | [.number, .draft, .head_ref, .base_ref, .head_sha, .base_sha] | @tsv' \
            "$RUNNER_TEMP/open-pull-requests.json"

          {
            echo "## Read-only merge-queue audit"
            echo
            echo "Open pull requests inspected: $count"
            echo "No branch updates, comments, labels, approvals, merges, or deletions were performed."
          } >> "$GITHUB_STEP_SUMMARY"
