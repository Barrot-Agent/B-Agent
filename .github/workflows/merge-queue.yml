name: Merge Queue (audit-only; fail closed)

on:
  workflow_dispatch:
    inputs:
      audit_reason:
        description: "Reason for running this read-only queue audit"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit-only:
    name: Report queue policy without changing repository
    runs-on: ubuntu-latest
    steps:
      - name: Validate audit reason and state policy
        shell: bash
        env:
          AUDIT_REASON: ${{ inputs.audit_reason }}
        run: |
          set -euo pipefail
          if [[ -z "${AUDIT_REASON//[[:space:]]/}" ]]; then
            echo "An audit reason is required." >&2
            exit 1
          fi
          echo "Merge automation is disabled pending explicit human authorization and independent controls review."
          echo "This workflow performs no PR, branch, label, comment, or merge mutations."
          echo "Audit reason: $AUDIT_REASON"
