name: Merge Queue (disabled pending explicit per-PR authorization)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled state
        run: |
          echo "The previous merge queue could update branches and merge every open PR when mode=all and dry_run=false."
          echo "It is disabled until a protected, per-PR explicit-authorization boundary is implemented and independently reviewed."
          echo "No credentials are read and no repository mutation is performed."
