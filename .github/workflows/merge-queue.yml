name: Merge Queue (fail-closed pending explicit authorization)

on:
  workflow_dispatch:
    inputs:
      audit_reason:
        description: "Reason for running the audit-only queue check"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  audit-only:
    name: Report queue state without changing repository
    runs-on: ubuntu-latest
    steps:
      - name: State fail-closed policy
        shell: bash
        env:
          AUDIT_REASON: ${{ inputs.audit_reason }}
        run: |
          set -euo pipefail
          test -n "$AUDIT_REASON"
          echo "Merge queue is fail-closed pending a separately reviewed authorization design."
          echo "This workflow performs no branch updates, approvals, labels, or merges."
          echo "No pull request was modified by this workflow."
