name: Merge Queue (disabled pending reviewed approval gates)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  disabled:
    name: Merge queue disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain safe stop
        shell: bash
        run: |
          set -euo pipefail
          echo "Automated merge queue is disabled pending independent review."
          echo "This workflow performs no PR inspection, branch update, comment, commit, push, or merge."
          echo "Re-enable only after reviewed gates enforce non-draft status, approved review, explicit approval label, exact current head SHA, required checks, and bounded dry-run defaults."
