name: Merge Queue (disabled pending explicit authorization)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  disabled:
    name: Fail-closed notice
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain disabled merge queue
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Merge queue disabled"
            echo
            echo "Automatic merging is disabled pending independently verified merge gates and explicit authorized approval."
            echo "This workflow does not update branches, approve, label, comment on, or merge pull requests."
            echo "No pull request was modified or merged."
          } >> "$GITHUB_STEP_SUMMARY"
