name: Coinbase Paper Trader
run-name: Paper trader simulation (${{ inputs.expected_main_sha }})

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type YES to approve one paper-trading simulation
        required: true
        type: string
      expected_main_sha:
        description: Exact 40-character current main commit to simulate and update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paper-trader-main
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PRODUCT_ID: BTC-USD
      STARTING_BALANCE_USD: "10000"
    steps:
      - name: Checkout exact approved main
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_main_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Require explicit confirmation and unchanged main
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "YES" ]] || { echo "::error::Explicit YES confirmation required"; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::A full 40-character main SHA is required"; exit 1; }
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          checked_out="$(git rev-parse HEAD)"
          [[ "$current_main" == "$EXPECTED_MAIN_SHA" && "$checked_out" == "$EXPECTED_MAIN_SHA" ]] || { echo "::error::main changed; refusing stale simulation"; exit 1; }
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          state = json.loads(Path("web/paper_trading_state.json").read_text(encoding="utf-8"))
          size = float(state.get("position_size", 0) or 0)
          if not math.isfinite(size) or size < 0:
              raise SystemExit("ABORT: non-finite or negative persisted position_size")
          if size > 1e-8:
              product = state.get("position_product")
              configured = os.environ["PRODUCT_ID"]
              if not isinstance(product, str) or not product.strip():
                  raise SystemExit("ABORT: open paper position has no product identity; state preserved")
              if product != configured:
                  raise SystemExit(f"ABORT: configured product {configured} does not match open position {product}; state preserved")
          print("Paper position identity preflight passed.")
          PY
      - name: Run guarded paper trader
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 scripts/coinbase_paper_trader.py
      - name: Upload simulated state
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-state
          path: |
            web/paper_trading_state.json
            web/paper_trading_log.jsonl
          if-no-files-found: error
          retention-days: 7

  persist:
    needs: simulate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Download simulated state
        uses: actions/download-artifact@v4
        with:
          name: paper-trading-state
          path: web
      - name: Verify unchanged main and allowed artifact scope
        shell: bash
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          PRODUCT_ID: BTC-USD
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "YES" ]] || { echo "::error::Confirmation missing"; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid expected main SHA"; exit 1; }
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" && "$current_main" == "$EXPECTED_MAIN_SHA" ]] || { echo "::error::main advanced after simulation; refusing state write"; exit 1; }
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' web/paper_trading_log.jsonl web/paper_trading_state.json | sort)"
          [[ "$changed" == "$expected" ]] || { echo "::error::artifact contains unexpected paths"; exit 1; }
          python3 - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          state = json.loads(Path("web/paper_trading_state.json").read_text(encoding="utf-8"))
          size = float(state.get("position_size", 0) or 0)
          if not math.isfinite(size) or size < 0:
              raise SystemExit("ABORT: invalid persisted position size")
          if size > 1e-8:
              product = state.get("position_product")
              if not isinstance(product, str) or not product.strip():
                  raise SystemExit("ABORT: persisted open position has no product identity")
              if product != os.environ["PRODUCT_ID"]:
                  raise SystemExit("ABORT: persisted position product mismatch")
          log_lines = Path("web/paper_trading_log.jsonl").read_text(encoding="utf-8").splitlines()
          if not log_lines:
              raise SystemExit("ABORT: empty paper-trading log")
          for line in log_lines[-5:]:
              json.loads(line)
          PY
      - name: Commit and push only validated paper state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add -- web/paper_trading_state.json web/paper_trading_log.jsonl
          if git diff --cached --quiet; then echo "No paper-state changes to persist"; exit 0; fi
          gh auth setup-git
          git push origin HEAD:main
