name: Coinbase Paper Trader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trade:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PRODUCT_ID: "BTC-USD"
      STARTING_BALANCE_USD: "10000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run simulated paper-trading cycle
        run: python3 scripts/coinbase_paper_trader.py
      - name: Upload simulation state and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coinbase-paper-trader-${{ github.run_id }}
          path: |
            web/paper_trading_state.json
            web/paper_trading_log.jsonl
          if-no-files-found: ignore
          retention-days: 14
