name: Barrot Controlled PR Approval (disabled pending verified human approval)

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    name: Fail-closed approval notice
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain disabled approval path
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Approval not performed"
            echo
            echo "This workflow has no write permissions and cannot apply labels, comments, approvals, or merges."
            echo "The prior repository-owner actor check did not establish a distinct human reviewer or protected-environment approval."
            echo "A replacement requires a GitHub Environment with independently verified required reviewers and exact-head binding."
            echo "No pull request was modified or merged."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APPROVAL_NOT_PERFORMED"
