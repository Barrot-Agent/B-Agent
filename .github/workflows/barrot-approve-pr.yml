name: Barrot Controlled PR Approval

"on":
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR number to approve"
        required: true
        type: string
      expected_head_sha:
        description: "Expected PR head SHA"
        required: true
        type: string
      reason:
        description: "Auditable reason for applying approved"
        required: true
        type: string
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  push-noop:
    name: No approval action on push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Confirm manual-only boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "Push event received. Approval remains manual-only; no PR action was performed."

  approve:
    name: Barrot controlled approval
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      APPROVAL_REASON: ${{ inputs.reason }}

    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number: $PR_NUMBER" >&2
            exit 1
          fi

          if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid expected head SHA." >&2
            exit 1
          fi

          if [[ -z "$APPROVAL_REASON" ]]; then
            echo "Approval reason is required." >&2
            exit 1
          fi

      - name: Inspect target PR
        shell: bash
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          pr_json="$(gh api "repos/${repo}/pulls/${PR_NUMBER}" --jq '{number,state,base_ref:.base.ref,head_sha:.head.sha,head_ref:.head.ref,head_repo:.head.repo.full_name}')"
          echo "$pr_json"

          state="$(printf '%s' "$pr_json" | jq -r '.state')"
          base_ref="$(printf '%s' "$pr_json" | jq -r '.base_ref')"
          head_sha="$(printf '%s' "$pr_json" | jq -r '.head_sha')"
          head_repo="$(printf '%s' "$pr_json" | jq -r '.head_repo')"

          if [[ "$state" != "open" || "$base_ref" != "main" || "$head_sha" != "$EXPECTED_HEAD_SHA" || "$head_repo" != "$repo" ]]; then
            echo "Target PR eligibility or expected-head check failed." >&2
            exit 1
          fi

      - name: Apply approved label
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=approved"

      - name: Record approval evidence
        shell: bash
        run: |
          set -euo pipefail
          timestamp="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          body_file="$(mktemp)"
          {
            printf '%s\n\n' "Barrot controlled approval recorded."
            printf 'PR: #%s\n' "$PR_NUMBER"
            printf 'Head SHA: %s\n' "$EXPECTED_HEAD_SHA"
            printf 'Reason: %s\n' "$APPROVAL_REASON"
            printf 'Workflow run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Recorded at: %s\n\n' "$timestamp"
            printf '%s\n' 'This action applied the approved label only. It did not merge the PR.'
          } > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          echo "BARROT_APPROVAL=PASS"
          echo "PR_NUMBER=$PR_NUMBER"
          echo "HEAD_SHA=$EXPECTED_HEAD_SHA"
          echo "APPROVAL_LABEL=approved"
          echo "MERGE_PERFORMED=FALSE"
