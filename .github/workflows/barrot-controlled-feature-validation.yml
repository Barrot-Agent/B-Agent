name: Barrot Controlled Feature Validation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate (currently restricted to #1225)"
        required: true
        type: string
      expected_head_sha:
        description: "Exact 40-character feature-branch commit SHA"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: barrot-controlled-feature-validation
  cancel-in-progress: false

jobs:
  validate-feature-commit:
    name: Validate exact Barrot feature commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate PR and pin exact commit
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" == "1225" ]] || { echo "Only Barrot PR #1225 is currently allowlisted." >&2; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected SHA must be 40 lowercase hex characters." >&2; exit 1; }

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '{state,base_ref,head_sha,head_ref,head_repo:.head.repo.full_name}')"
          echo "$pr_json"

          state="$(jq -r '.state' <<<"$pr_json")"
          base_ref="$(jq -r '.base_ref' <<<"$pr_json")"
          head_sha="$(jq -r '.head_sha' <<<"$pr_json")"
          head_ref="$(jq -r '.head_ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head_repo' <<<"$pr_json")"

          [[ "$state" == "open" ]] || { echo "PR is not open." >&2; exit 1; }
          [[ "$base_ref" == "main" ]] || { echo "PR must target main." >&2; exit 1; }
          [[ "$head_ref" == "feat/bundle-task-dispatch-resume-20261027" ]] || { echo "Unexpected feature branch." >&2; exit 1; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || { echo "Cross-repository PRs are not permitted." >&2; exit 1; }
          [[ "$head_sha" == "$EXPECTED_HEAD_SHA" ]] || { echo "PR head SHA does not match the requested SHA." >&2; exit 1; }

          echo "validated_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Validated PR #$PR_NUMBER at $head_sha"

      - name: Checkout the validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.validated_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run durable lifecycle and recovery tests
        run: |
          python -m pytest -q --no-cov tests/test_bundle_lifecycle.py tests/test_barrot_agent_script.py

      - name: Record exact tested commit
        if: always()
        env:
          VALIDATED_SHA: ${{ steps.validate.outputs.validated_sha }}
        run: |
          echo "PR_NUMBER=1225"
          echo "VALIDATED_SHA=${VALIDATED_SHA:-validation-failed}"
          echo "GROQ_API_KEY_USED=FALSE"
          echo "REPOSITORY_WRITE_PERMISSIONS=FALSE"
          echo "PURPOSE=Feature-branch lifecycle/recovery validation only"
