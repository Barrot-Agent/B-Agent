name: Capability 9 - Evidence Conflict Review (quarantined)

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Legacy resolver disabled; use the deterministic local conflict-report script."
        required: true
        default: "[]"

permissions: {}

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Explain evidence-first quarantine
        run: |
          echo "Disabled: the former Groq resolver guessed which conflicting record was true, did not update the dataset, and saved the unchanged input as resolved."
          echo "The replacement local script preserves every observation, source identity, provenance gap, and minority objection as unresolved until primary evidence is reviewed."
          echo "No Groq credentials are loaded, no network call is made, and no repository mutation occurs."
