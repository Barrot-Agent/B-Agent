name: Sync Self-Hosted Brain (quarantined: LunaRoute-only architecture)

on:
  workflow_dispatch:

# BARROT_SYNC.md declares LunaRoute as the sole Barrot brain.
# Keep the historical self_hosted_brain/ code; do not deploy a second brain.
# Re-enable only after an explicit architecture decision and separate authorization.
permissions: {}

jobs:
  disabled:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain quarantine
        run: |
          echo "This workflow is intentionally disabled."
          echo "LunaRoute is the sole declared Barrot brain."
          echo "No second-brain deployment, secret access, or secret rotation is permitted here."
          echo "Historical self_hosted_brain/ code is retained without deployment."
