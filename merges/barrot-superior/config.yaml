slices:
  - sources:
      - model: google/gemma-4-E2B-it
        layer_range: [0, 32]
      - model: Qwen/Qwen2-VL-2B-Instruct
        layer_range: [0, 32]
merge_method: slerp
base_model: google/gemma-4-E2B-it
parameters:
  t:
    - filter: self_attn
      value: [0, 0.5, 0.3, 0.7, 1]
    - filter: mlp
      value: [1, 0.5, 0.7, 0.3, 0]
    - value: 0.5
dtype: bfloat16
tokenizer_source: base
