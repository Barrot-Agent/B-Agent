name: Diagnose Cloudflare Token

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Compare account ID + check token permissions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== token verify ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify" | jq '{success, status: .result.status}'
          echo "=== accounts this token can see, and whether the secret matches ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts" | jq --arg want "$CLOUDFLARE_ACCOUNT_ID" '{success, accounts: [.result[]? | {name, matches_secret: (.id == $want)}]}'
          echo "=== direct call to the exact failing endpoint, bypassing wrangler entirely ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | jq '{success, errors}'
