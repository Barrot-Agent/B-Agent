name: Capability 1 - Market Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run market analysis
        run: python3 scripts/market_analysis_engine.py
      - name: Commit results
        run: |
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add market_analysis_*.json
          git diff --cached --quiet || git commit -m "Market analysis: automated recommendation generation [skip ci]"
          git push || (git pull --no-rebase --no-edit origin main && git push)
