name: Databricks Bundle Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-deploy-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Git debug
        run: |
          git status
          git branch -a
          git rev-parse HEAD

      - name: Check for databricks.yml
        id: check_bundle
        run: |
          if [ -f "${{ github.workspace }}/databricks.yml" ]; then
            echo "bundle_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::databricks.yml not found in repository root; skipping bundle steps"
            echo "bundle_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate bundle
        if: steps.check_bundle.outputs.bundle_exists == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: dev
          BUNDLE_ROOT: ${{ github.workspace }}
        run: |
          databricks bundle validate --target dev

      - name: Deploy bundle
        if: steps.check_bundle.outputs.bundle_exists == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: dev
          BUNDLE_ROOT: ${{ github.workspace }}
        run: |
          databricks bundle deploy --target dev

      - name: Run job
        if: steps.check_bundle.outputs.bundle_exists == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_BUNDLE_ENV: dev
          BUNDLE_ROOT: ${{ github.workspace }}
        run: |
          databricks bundle run barrot_job --target dev
