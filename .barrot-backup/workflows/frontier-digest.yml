name: Frontier Digest

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAIN_MODEL: ${{ vars.BRAIN_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Ingest arxiv + benchmark coverage
        run: python3 scripts/frontier_ingest.py
      - name: Distill new entries
        run: python3 scripts/frontier_distill.py
      - name: Run gap analysis (frontier findings vs current stack)
        run: python3 scripts/frontier_gap_analysis.py
      - name: Commit frontier log + upgrade recommendations
        run: |
          git config user.email "barrot@barrot-agent.com"
          git config user.name "Barrot-Agent"
          git add ping-pongings/knowledge-base/frontier_log.jsonl ping-pongings/knowledge-base/upgrade_recommendations.jsonl
          git diff --cached --quiet || git commit -m "Frontier digest: ingest + distill + gap analysis [skip ci]"
          git push || (git pull --no-rebase --no-edit origin main && git push)
