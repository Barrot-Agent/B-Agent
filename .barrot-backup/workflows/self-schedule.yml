name: Barrot Self-Scheduling

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  detect-gaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run gap detection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/self_schedule.py
