name: Sindy MCP CI/CD

on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: "Episode number to process (1-15, or 'all')"
        required: false
        default: "all"
  push:
    branches: [ Main ]
    paths:
      - "sindy_videos/**"
      - "mcp_*.py"
      - "mcp_orchestrator.py"

permissions:
  contents: read

jobs:
  validate:
    name: Validate MCP modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests huggingface_hub

      - name: Syntax check MCP modules
        run: |
          python -m py_compile mcp_huggingface.py
          python -m py_compile mcp_databricks.py
          python -m py_compile mcp_github.py
          python -m py_compile mcp_orchestrator.py
          echo "All MCP modules passed syntax check."

      - name: Import check MCP modules
        run: |
          python -c "from mcp_huggingface import HuggingFaceMCP; print('HuggingFaceMCP OK')"
          python -c "from mcp_databricks import DatabricksMCP; print('DatabricksMCP OK')"
          python -c "from mcp_github import GitHubMCP; print('GitHubMCP OK')"
          python -c "
          from mcp_orchestrator import MCPOrchestrator, OrchestratorConfig
          cfg = OrchestratorConfig(download_models=False, use_databricks=False, commit_to_github=False, trigger_cicd=False)
          orch = MCPOrchestrator(cfg)
          v = orch.validate_config()
          print('OrchestratorConfig:', v)
          print('MCPOrchestrator OK')
          "

      - name: Validate orchestrator config
        run: |
          python -c "
          from mcp_orchestrator import OrchestratorConfig
          cfg = OrchestratorConfig.from_env()
          print('from_env() OK:', cfg.github_owner, cfg.github_branch)
          "

  episode-metadata:
    name: Log episode metadata
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Dump episode info
        run: |
          python -c "
          from stupid_sindy_series_generator import get_all_episodes
          eps = get_all_episodes()
          for ep in eps:
              print(f'  Ep {ep.episode_number:02d}: {ep.title!r}  scenes={len(ep.scenes)}')
          print(f'Total: {len(eps)} episodes')
          "
