[pytest]
pythonpath =
    products/github-pr-template-pack-self-guided/deliverables
markers =
    cinematic: tests for the cinematic production subsystem
testpaths = tests
norecursedirs = tests/fixtures
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=barrot_agent
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    -v
