[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-agent"
version = "0.1.0"
description = "B-Agent: Barrot Agent with IBM Granite 4.0-3B Vision"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "streamlit>=1.41.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "safetensors>=0.5.0",
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "numpy>=2.1.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    "websockets>=14.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Heavy/optional integrations used by barrot_agent.orchestration (deploy,
# inference_node), barrot_agent.analysis and barrot_agent.tools.kaggle_*.
# Install with:  pip install -e ".[integrations]"
integrations = [
    "databricks-sdk>=0.40.0",
    "flask>=3.1.0",
    "huggingface_hub>=0.23.0,<0.31",
    "kaggle>=1.5.12,<1.6",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "cdp-sdk>=1.0.0",
]

[tool.setuptools.packages.find]
# Explicit scope: the repo root is a flat layout holding several __init__.py
# directories (tests, data, examples, ...). Without this, setuptools
# auto-discovery refuses to build ("Multiple top-level packages discovered").
include = ["barrot_agent", "barrot_agent.*", "data", "directive_platform", "directive_platform.*"]

[tool.setuptools.package-data]
barrot_agent = ["data/missions/*.json"]
data = [
    "merge_conflict_unified.json",
    "research/navier_stokes_research_bundle.json",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.coverage.run]
# Measure every Barrot package. Do not exclude migrated subpackages merely
# because their tests or coverage were added later.
source = ["barrot_agent", "directive_platform", "data"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
# Full-suite thresholds are enforced in .github/workflows/ci.yml; local subset runs stay ungated.
# Keep this at zero so scoped tests and variant scoring are not failed by partial coverage.
fail_under = 0
show_missing = true
