[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-agent"
version = "0.1.0"
description = "B-Agent: Barrot Agent with IBM Granite 4.0-3B Vision"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "streamlit>=1.35.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "safetensors>=0.4.3",
    "pillow>=10.3.0",
    "requests>=2.32.0",
    "numpy>=1.26.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["barrot_agent"]
branch = true
omit = ["*/__pycache__/*", "tests/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.setuptools.package-data]
barrot_agent = ["data/missions/*.json"]
data = [
    "merge_conflict_unified.json",
    "millennium_problems_unified.json",
    "character_capabilities_unified.json",
    "longevity_unified.json",
    "biomarker_tracking.json",
    "reprogramming_protocols.json",
    "integration_report.json",
    "mmi_monetization_unified.json",
    "research/anthropic_fermats_last_theorem_bundle.json",
    "research/navier_stokes_research_bundle.json",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["barrot_agent", "barrot_agent.*", "data"]
namespaces = false
