[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-agent"
version = "0.1.0"
description = "B-Agent: Barrot Agent with IBM Granite 4.0-3B Vision"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "streamlit>=1.41.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "safetensors>=0.5.0",
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "numpy>=2.1.0",
    "PyJWT>=2.10.0",
    "cryptography>=44.0.0",
    "websockets>=14.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Heavy/optional integrations used by barrot_agent.orchestration (deploy,
# inference_node), barrot_agent.analysis and barrot_agent.tools.kaggle_*.
# Install with:  pip install -e ".[integrations]"
integrations = [
    "databricks-sdk>=0.40.0",
    "flask>=3.1.0",
    "huggingface_hub>=0.23.0,<0.31",
    "kaggle>=1.5.12,<1.6",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "cdp-sdk>=1.0.0",
]

[tool.setuptools.packages.find]
# Explicit scope: the repo root is a flat layout holding several __init__.py
# directories (tests, data, examples, ...). Without this, setuptools
# auto-discovery refuses to build ("Multiple top-level packages discovered").
include = ["barrot_agent*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["barrot_agent"]
omit = [
    "tests/*",
    "**/__init__.py",
    "barrot_agent/rendering/*",
    "barrot_agent/smart_agent.py",
    # subpackages migrated from root level where they were previously not measured;
    # no pre-existing tests existed for these modules before this restructuring.
    "barrot_agent/agi/*",
    "barrot_agent/ingestion/*",
    "barrot_agent/analysis/*",
    "barrot_agent/monetization/*",
    "barrot_agent/orchestration/*",
    "barrot_agent/mem_palace.py",
]

[tool.coverage.report]
# Coverage gate lives in CI on the FULL suite only (.github/workflows/ci.yml).
# It must not live here: this section applies to every invocation, so a scoped
# run (4 files, 72/72 tests passing) would exit 1 at 14% coverage and corrupt
# variant scoring in scripts/transmute.py. Do not reintroduce fail_under here.
fail_under = 0
show_missing = true
