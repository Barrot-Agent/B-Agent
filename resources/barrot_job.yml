resources:
  jobs:
    barrot_job:
      name: barrot-job
      tasks:
        - task_key: run_barrot_job
          spark_python_task:
            python_file: ./src/barrot_job_entry.py
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
